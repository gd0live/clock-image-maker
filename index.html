<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock Image Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171717;
      color: #fff;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    body.drawer-open {
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 330px 1fr;
      min-height: 100vh;
    }

    .panel {
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: #232323;
      border-right: 1px solid #444;
      overflow-y: auto;
    }

    .panel h1 {
      order: 0;
      margin: 0 0 14px;
      font-size: 20px;
    }

    .menu-toggle {
      display: none;
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 30;
      height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(241, 214, 168, 0.45);
      border-radius: 999px;
      background: rgba(35, 35, 35, 0.92);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      color: #f1d6a8;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .menu-toggle-icon {
      display: none;
    }

    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 24;
      border: 0;
      background: rgba(0, 0, 0, 0.48);
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .section {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #444;
    }

    .section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .section h2 {
      margin: 0 0 10px;
      color: #f1d6a8;
      font-size: 15px;
    }

    .section-save {
      order: 1;
      margin-bottom: 12px;
    }

    .section-image {
      order: 2;
    }

    .section-clock {
      order: 3;
    }

    .section-text {
      order: 4;
    }

    details.section summary {
      margin: 0 0 10px;
      color: #f1d6a8;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    details.section:not([open]) summary {
      margin-bottom: 0;
    }

    .field {
      margin-bottom: 10px;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: start;
      margin-bottom: 10px;
    }

    .field-row .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 0;
    }

    .field-row .field label {
      font-size: 12px;
      color: #ccc;
      margin: 0;
    }

    .field-row .field input[type="range"] {
      margin: 5px 0;
    }

    .field-row .field input[type="color"] {
      width: 100%;
    }

    .background-row .field {
      display: grid;
      grid-template-rows: 16px 32px;
      gap: 4px;
    }

    .background-row .field input[type="range"] {
      align-self: center;
      margin: 0;
    }

    .background-row .field input[type="color"] {
      align-self: center;
      height: 32px;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      height: 4px;
      width: 100%;
      padding: 0;
    }

    input[type="color"] {
      appearance: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 4px;
      background: #111;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 2px;
    }

    .field input:not([type="range"]) {
      width: 100%;
    }

    .range-row input[type="range"] {
      width: 100%;
    }

    .range-value {
      color: #ddd;
      font-size: 12px;
      text-align: right;
    }

    .compact-group {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      padding: 9px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #1d1d1d;
    }

    .compact-group .field {
      margin-bottom: 0;
    }

    .label-toolbar {
      display: grid;
      grid-template-columns: 60px repeat(6, 32px);
      gap: 6px;
      align-items: end;
      margin-bottom: 10px;
    }

    .text-format-toolbar {
      grid-template-columns: 60px repeat(6, 32px);
    }

    .text-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      gap: 8px;
      align-items: end;
      margin-bottom: 10px;
    }

    .text-input-row .field {
      margin-bottom: 0;
    }

    .text-input-row .format-field {
      display: block;
      min-width: 0;
    }

    .text-input-row .format-field span {
      display: block;
      margin-bottom: 4px;
      overflow: hidden;
      color: #ccc;
      font-size: 11px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label-toolbar label {
      display: block;
      min-width: 0;
    }

    .label-toolbar span {
      display: block;
      margin-bottom: 4px;
      overflow: hidden;
      color: #ccc;
      font-size: 11px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label-toolbar select,
    .label-toolbar input[type="color"],
    .format-toggle {
      display: block;
      width: 100%;
      height: 32px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 5px;
      background: #111;
      color: #fff;
    }

    .format-toggle {
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: 700;
    }

    .format-toggle.is-active {
      border-color: #f1d6a8;
      background: #f1d6a8;
      color: #352517;
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: -2px 0 10px;
      color: #ccc;
      font-size: 12px;
    }

    .check-field input {
      width: auto;
      accent-color: #f1d6a8;
    }

    .time-picker {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: end;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .time-picker span {
      display: block;
      margin-bottom: 4px;
      color: #ccc;
      font-size: 12px;
    }

    .time-picker select {
      width: 100%;
      height: 32px;
      padding: 6px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: white;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #ccc;
    }

    .field input:not([type="range"]),
    .field select {
      width: 100%;
      height: 32px;
      padding: 6px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: white;
    }

    .field input[type="file"] {
      height: 40px;
      padding: 0 8px;
      font-size: 12px;
      line-height: 38px;
    }

    .image-input-help {
      margin: 0 0 6px;
      color: #ccc;
      font-size: 12px;
      line-height: 1.45;
    }

    .hint {
      order: 0;
      margin: -3px 0 13px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      height: 32px;
      margin-top: 4px;
      padding: 6px 12px;
      border: 0;
      border-radius: 10px;
      background: #f1d6a8;
      color: #352517;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
    }

    .button:hover {
      background: #ffe4b7;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .button-secondary {
      border: 1px solid #666;
      background: transparent;
      color: #ddd;
    }

    .button-secondary:hover {
      background: #333;
    }

    .save-row {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .save-output {
      grid-template-columns: minmax(0, 1fr) 136px;
      align-items: end;
    }

    .save-row .button {
      height: 32px;
      margin-top: 0;
      padding: 6px;
      font-size: 13px;
    }

    .download-menu {
      position: relative;
      display: block;
    }

    .download-menu .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 10px;
    }

    .download-caret {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.4;
    }

    .download-options {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 60;
      width: 100%;
      padding: 4px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #111;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
    }

    .download-options[hidden] {
      display: none;
    }

    .download-options button {
      display: block;
      width: 100%;
      height: 30px;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #ddd;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      text-align: left;
    }

    .download-options button:hover,
    .download-options button[aria-checked="true"] {
      background: #333;
      color: #f1d6a8;
    }

    .download-options button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .editor-chrome {
      position: sticky;
      top: 0;
      z-index: 12;
      width: 100%;
      border-bottom: 1px solid #343434;
      background: #202020;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }

    .editor-menubar {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      height: 34px;
      padding: 0 10px;
      overflow-x: auto;
      border-bottom: 1px solid #303030;
      background: #252525;
      scrollbar-width: thin;
    }

    .editor-menu-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #cfcfcf;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .editor-menu-button:hover {
      background: #333;
      color: #fff;
    }

    .editor-menu-button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .editor-menu-button:disabled:hover {
      background: transparent;
      color: #cfcfcf;
    }

    .editor-menu-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .workspace-tabs {
      display: block;
      border-bottom: 1px solid #444;
      background: #1b1b1b;
    }

    .tab-list {
      display: flex;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .workspace-tab {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 76px;
      max-width: 136px;
      height: 32px;
      padding: 0 5px 0 10px;
      border: 1px solid #444;
      border-bottom: 0;
      border-radius: 0;
      background: #1b1b1b;
      color: #aaa;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .workspace-tab + .workspace-tab {
      margin-left: -1px;
    }

    .workspace-tab:hover {
      background: #282828;
      color: #eee;
    }

    .workspace-tab[aria-selected="true"] {
      position: relative;
      z-index: 1;
      border-color: #666;
      background: #171717;
      color: #f1d6a8;
    }

    .workspace-tab-dirty {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f1d6a8;
    }

    .workspace-tab-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace-tab-label:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .workspace-tab-name-input {
      width: 82px;
      min-width: 0;
      height: 22px;
      padding: 1px 5px;
      border: 1px solid #777;
      border-radius: 3px;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: 0;
    }

    .workspace-tab-name-input:focus {
      border-color: #f1d6a8;
      box-shadow: 0 0 0 1px rgba(241, 214, 168, 0.22);
    }

    .workspace-tab-close {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      opacity: 0.55;
    }

    .workspace-tab-close:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      opacity: 1;
    }

    .workspace-tab[aria-selected="true"] .workspace-tab-close:hover {
      background: rgba(241, 214, 168, 0.16);
      color: #f8e1b9;
    }

    .workspace-tab-close svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2.2;
    }

    .slot-select {
      display: none;
    }

    .save-row select,
    .slot-select {
      width: 100%;
      height: 32px;
      padding: 6px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: #fff;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      max-width: min(320px, calc(100vw - 40px));
      padding: 10px 14px;
      border: 1px solid rgba(241, 214, 168, 0.4);
      border-radius: 999px;
      background: rgba(22, 22, 22, 0.92);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      color: #f1d6a8;
      font-size: 13px;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.is-error {
      border-color: rgba(255, 154, 154, 0.45);
      color: #ff9a9a;
    }

    .preview {
      display: grid;
      position: relative;
      grid-template-rows: auto minmax(0, 1fr);
      place-items: stretch;
      align-content: stretch;
      gap: 12px;
      padding: 0;
      overflow: auto;
    }

    .preview-stage {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 32px;
    }

    .preview-toolbar {
      position: fixed;
      right: 16px;
      top: 50%;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;

      width: 38px;
      height: 250px;
      padding: 10px 7px;
      border: 1px solid #3f3f3f;
      border-radius: 6px;
      background: rgba(35, 35, 35, 0.92);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      transform: translateY(-50%);
    }

    .preview-toolbar .zoom-fit {
      width: 24px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #bdbdbd;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .preview-toolbar .zoom-fit.is-active {
      color: #f1d6a8;
    }

    .preview-toolbar .zoom-slider {
      flex: 1;
      width: 170px;
      height: 22px;
      padding: 0;
      writing-mode: vertical-lr;
      direction: rtl;
      accent-color: #ff8a65;
    }

    @media (max-width: 760px) {
      .preview-toolbar {
        position: fixed;
        top: 50%;
        right: 8px;
        width: 34px;
        height: 220px;
        padding: 9px 6px;
      }

      .preview-toolbar .zoom-slider {
        width: 145px;
      }
    }

    .canvas {
      position: relative;
      width: var(--preview-size, min(80vw, 900px));
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #333;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .canvas.is-dragging {
      cursor: grabbing;
    }

    .canvas.is-drop-target::after {
      content: "이미지를 놓아 적용";
      position: absolute;
      inset: 10px;
      z-index: 8;
      display: grid;
      place-items: center;
      border: 2px dashed rgba(255, 228, 183, 0.9);
      background: rgba(0, 0, 0, 0.18);
      color: #ffe4b7;
      font-size: clamp(13px, 2.4vw, 18px);
      font-weight: 800;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      left: 50%;
      top: 50%;

      max-width: none;
      max-height: none;

      width: 100%;
      height: 100%;
      object-fit: contain;

      transform: translate(-50%, -50%) translate(var(--image-x), var(--image-y)) scale(var(--image-scale));
      transform-origin: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .outside-mask {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .clock {
      position: absolute;
      left: 50%;
      top: 54%;
      width: var(--clock-size);
      height: var(--clock-size);
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
    }

    .face {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ring-size);
      height: var(--ring-size);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    .tick {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 50% 100%;
    }

    .date-marker {
      position: absolute;
      left: 50%;
      top: 50%;
      color: var(--clock-color);
      font-family: Pretendard, "Noto Sans KR", sans-serif;
      font-size: clamp(12px, 5.2cqw, 34px);
      font-weight: 900;
      line-height: 1;
      paint-order: stroke;
      pointer-events: none;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 0.72),
        0 1px 4px rgba(0, 0, 0, 0.55);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3.5%;
      height: 3.5%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .label-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }

    .label-svg text {
      paint-order: stroke;
      stroke-linejoin: round;
    }

    @media (max-width: 760px) {
      .app {
        display: block;
        min-height: 100dvh;
      }

      .menu-toggle {
        display: grid;
        place-items: start center;
        left: 0;
        top: 0;
        z-index: 25;
        width: 28px;
        height: 100dvh;
        padding: 10px 0 0;
        border: 0;
        border-right: 1px solid #444;
        border-radius: 0;
        background: #1d1d1d;
        box-shadow: none;
        color: #f1d6a8;
        font-size: 0;
      }

      .menu-toggle-icon {
        align-items: center;
        justify-content: center;
        display: inline-flex;
        width: 22px;
        height: 28px;
        border-radius: 4px;
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
      }

      body.drawer-open .menu-toggle {
        left: min(88vw, 360px);
        z-index: 31;
        border-left: 1px solid #444;
        border-right: 0;
        background: #1d1d1d;
      }

      .menu-toggle:hover .menu-toggle-icon {
        background: #333;
      }

      .panel {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 26;
        width: min(88vw, 360px);
        max-width: 360px;
        border-right: 1px solid #555;
        box-shadow: 18px 0 40px rgba(0, 0, 0, 0.45);
        transform: translateX(-105%);

      .drawer-overlay.is-visible {

      .preview {
        width: calc(100vw - 28px);

      .toast {

  </style>

  <script>
    const RING_SIZE = 88;
    const DEFAULT_CLOCK_SIZE = 96;
    const CLOCK_CENTER_Y = 54;
    const TICK_RADIUS_PERCENT = 43;
    const BAR_TICK_WIDTH_PERCENT = 1.5;
    const BAR_TICK_HEIGHT_PERCENT = 7;
    const DOT_TICK_SIZE_PERCENT = 2.8;
    const HOUR_HAND_LENGTH_PERCENT = 27;
    const MINUTE_HAND_LENGTH_PERCENT = 36;
    const MONTH_MARKER_LENGTH_PERCENT = 32;
    const CENTER_DOT_SIZE_PERCENT = 3.5;
    const LABEL_FONT_SIZE_PERCENT = 6.2;
    const LABEL_RADIUS_BASE_PERCENT = 45;
    const LABEL_START_OFFSET_BASE_PERCENT = 50;
    const LABEL_OFFSET_TO_ANGLE_RATIO = Math.PI / 100;
    const LABEL_STROKE_WITH_FILL_PERCENT = 1.25;
    const LABEL_STROKE_ONLY_PERCENT = 0.62;
    const HISTORY_LIMIT = 30;
    const DB_NAME = "clock-image-maker";
    const DB_STORE = "settings";
    const DB_KEY = "current";
    const SLOT_LABELS_KEY = "slot-labels";
    const SLOT_TABS_KEY = "slot-tabs";
    const SLOT_COUNT = 6;
    function createDefaultState() {
      const now = new Date();

      return {
        imageUrl: "",
        imageMime: "",
        imageX: 0,
        imageY: 0,
        imageScale: 100,
        imageSectionOpen: true,

        labelText: "",
        labelFont: "Pretendard, 'Noto Sans KR', sans-serif",
        fontPreset: "pretendard",
        labelBold: true,
        labelItalic: false,
        labelFontSize: 100,
        labelFillColor: "#ffffff",
        labelFillNone: false,
        labelStrokeColor: "#000000",
        labelStrokeNone: false,
        labelGap: 0,
        labelOffset: 0,

        hour: (now.getHours() % 12) || 12,
        minute: now.getMinutes(),
        includeTime: true,
        dateMarkers: false,

        theme: "classic",
        clockColor: "#fff8ec",

        outsideColor: "#000000",
        outsideOpacity: 0.30,
        exportFormat: "png",
        previewZoom: "fit",
        clockSectionOpen: true,
        textSectionOpen: true
      };
    }

    const state = createDefaultState();
    const undoStack = [];
    const redoStack = [];
    let pendingHistorySnapshot = null;
    let pendingHistoryCommitted = false;
    const historyImages = new Map();
    let historyImageId = 0;
    let statusTimer = null;
    let cacheStatusTimer = null;
    let settingsSaveVersion = 0;
    let activeSlotBaselineSnapshot = null;
    let isExporting = false;

    const themes = {
      classic: {
        color: "#fff8ec",
        ring: {
          widthPx: 10,
          widthPercent: 0.009,
          style: "solid"
        },
        ticks: {
          type: "bar"
        },
        hands: {
          type: "round"
        },
        centerDot: false
      },
      double: {
        color: "#fff8ec",
        ring: {
          widthPx: 8,
          widthPercent: 0.009,
          style: "double",
          innerWidthPercent: 0.003,
          innerInsetPercent: 0.009
        },
        ticks: {
          type: "bar"
        },
        hands: {
          type: "diamond"
        },
        centerDot: false
      },
      minimal: {
        color: "#ffffff",
        ring: {
          widthPx: 4,
          widthPercent: 0.004,
          style: "solid"
        },
        ticks: {
          type: "none"
        },
        hands: {
          type: "thin"
        },
        centerDot: false
      },
      dot: {
        color: "#ffffff",
        ring: {
          widthPx: 8,
          widthPercent: 0.009,
          style: "solid"
        },
        ticks: {
          type: "dot"
        },
        hands: {
          type: "taper"
        },
        centerDot: true
      }
    };

    const $ = id => document.getElementById(id);

    const els = {
      file: $("file"),
      imageX: $("imageX"),
      imageY: $("imageY"),
      imageScale: $("imageScale"),
      imageXValue: $("imageXValue"),
      imageYValue: $("imageYValue"),
      imageScaleValue: $("imageScaleValue"),
      labelText: $("labelText"),
      labelFont: $("labelFont"),
      fontPreset: $("fontPreset"),
      customFontField: $("customFontField"),
      labelBold: $("labelBold"),
      labelItalic: $("labelItalic"),
      labelFontSize: $("labelFontSize"),
      labelFillColor: $("labelFillColor"),
      labelFillNone: $("labelFillNone"),
      labelStrokeColor: $("labelStrokeColor"),
      labelStrokeNone: $("labelStrokeNone"),
      labelGap: $("labelGap"),
      labelGapValue: $("labelGapValue"),
      labelOffset: $("labelOffset"),
      labelOffsetValue: $("labelOffsetValue"),
      pickerHour: $("pickerHour"),
      pickerMinute: $("pickerMinute"),
      includeTime: $("includeTime"),
      dateMarkers: $("dateMarkers"),
      theme: $("theme"),
      clockColor: $("clockColor"),
      outsideColor: $("outsideColor"),
      outsideOpacity: $("outsideOpacity"),
      previewFit: $("previewFit"),
      previewZoom: $("previewZoom"),
      previewZoomValue: $("previewZoomValue"),
      exportSize: $("exportSize"),
      exportFormatMenu: $("exportFormatMenu"),
      exportFormatList: $("exportFormatList"),
      download: $("download"),
      downloadLabel: $("downloadLabel"),
      statusMessage: $("statusMessage"),
      importSettingsFile: $("importSettingsFile"),
      slotTabs: $("slotTabs"),
      slotSelect: $("slotSelect"),
      imageSection: $("imageSection"),
      clockSection: $("clockSection"),
      textSection: $("textSection"),
      menuToggle: $("menuToggle"),
      menuToggleIcon: $("menuToggleIcon"),
      drawerOverlay: $("drawerOverlay"),
      settingsPanel: $("settingsPanel"),
      editorMenubar: $("editorMenubar"),

      canvas: $("canvas"),
      bg: $("bg"),
      bgImg: $("bgImg"),
      outsideMask: $("outsideMask"),
      clock: $("clock")
    };

    let activeSlotValue = els.slotSelect.value;
    let openSlotValues = [activeSlotValue];
    let slotLabels = {};

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, Number(value)));
    }

    function openSettingsDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.addEventListener("upgradeneeded", () => {
          request.result.createObjectStore(DB_STORE);
        });

        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
    }

    async function loadSettings() {
      try {
        const db = await openSettingsDb();
        const cached = await new Promise((resolve, reject) => {
          const request = db.transaction(DB_STORE).objectStore(DB_STORE).get(DB_KEY);
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();

        if (cached) {
          Object.assign(state, cached);
          if (!Object.prototype.hasOwnProperty.call(cached, "fontPreset")) {
            state.fontPreset = "custom";
          }
          if (cached.labelStrokeColor === "#5a321f") {
            state.labelStrokeColor = "#000000";
          }
        }
        state.labelGap = clamp(state.labelGap, -3, 3);
      } catch (error) {
        console.warn("설정 캐시를 불러오지 못했습니다.", error);
      }
    }

    async function saveSettings(options = {}) {
      const { notify = false } = options;
      const saveVersion = ++settingsSaveVersion;

      try {
        const db = await openSettingsDb();
        await new Promise((resolve, reject) => {
          const request = db
            .transaction(DB_STORE, "readwrite")
            .objectStore(DB_STORE)
            .put({ ...state }, DB_KEY);

          request.addEventListener("success", () => resolve());
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();
        if (notify && saveVersion === settingsSaveVersion) {
          queueCacheSavedStatus();
        }
      } catch (error) {
        console.warn("설정 캐시를 저장하지 못했습니다.", error);
        if (saveVersion === settingsSaveVersion) {
          showStatus("캐시 저장 실패", "error", 3500);
        }
      }
    }

    function getHistoryImageRef(imageUrl) {
      if (!imageUrl) return "";

      for (const [ref, cachedImageUrl] of historyImages.entries()) {
        if (cachedImageUrl === imageUrl) return ref;
      }

      const ref = `image-${++historyImageId}`;
      historyImages.set(ref, imageUrl);
      return ref;
    }

    function cloneSettingsSnapshot() {
      const snapshot = JSON.parse(JSON.stringify(state));
      snapshot.imageRef = getHistoryImageRef(snapshot.imageUrl);
      delete snapshot.imageUrl;
      return snapshot;
    }

    function expandSettingsSnapshot(snapshot) {
      if (!snapshot || Object.prototype.hasOwnProperty.call(snapshot, "imageUrl")) {
        return JSON.parse(JSON.stringify(snapshot || {}));
      }

      const expanded = JSON.parse(JSON.stringify(snapshot));
      expanded.imageUrl = expanded.imageRef
        ? historyImages.get(expanded.imageRef) || ""
        : "";
      delete expanded.imageRef;
      return expanded;
    }

    function snapshotsEqual(a, b) {
      const snapshotA = Object.prototype.hasOwnProperty.call(a || {}, "imageUrl")
        ? cloneComparableSnapshot(a)
        : a;
      const snapshotB = Object.prototype.hasOwnProperty.call(b || {}, "imageUrl")
        ? cloneComparableSnapshot(b)
        : b;
      return JSON.stringify(snapshotA) === JSON.stringify(snapshotB);
    }

    function cloneComparableSnapshot(value) {
      const snapshot = JSON.parse(JSON.stringify(value || {}));
      snapshot.imageRef = getHistoryImageRef(snapshot.imageUrl);
      delete snapshot.imageUrl;
      return snapshot;
    }

    function updateHistoryButtons() {
      const undoDisabled = undoStack.length === 0;
      const redoDisabled = redoStack.length === 0;
      els.editorMenubar
        ?.querySelector("[data-menu-command='undo']")
        ?.toggleAttribute("disabled", undoDisabled);
      els.editorMenubar
        ?.querySelector("[data-menu-command='redo']")
        ?.toggleAttribute("disabled", redoDisabled);
    }

    function showStatus(message, type = "info", duration = 2000) {
      window.clearTimeout(statusTimer);
      window.clearTimeout(cacheStatusTimer);
      els.statusMessage.textContent = message;
      els.statusMessage.classList.toggle("is-error", type === "error");
      els.statusMessage.classList.add("is-visible");

      statusTimer = window.setTimeout(() => {
        els.statusMessage.classList.remove("is-visible", "is-error");
      }, duration);
    }

    function queueCacheSavedStatus() {
      window.clearTimeout(cacheStatusTimer);
      cacheStatusTimer = window.setTimeout(() => {
        showStatus("캐시에 저장됨", "info", 1400);
      }, 450);
    }

    function cleanupHistoryImages() {
      const usedRefs = new Set();

      [...undoStack, ...redoStack, pendingHistorySnapshot]
        .filter(Boolean)
        .forEach(snapshot => {
          if (snapshot.imageRef) {
            usedRefs.add(snapshot.imageRef);
          }
        });

      const currentRef = getHistoryImageRef(state.imageUrl);
      if (currentRef) {
        usedRefs.add(currentRef);
      }

      Array.from(historyImages.keys()).forEach(ref => {
        if (!usedRefs.has(ref)) {
          historyImages.delete(ref);
        }
      });
    }

    function pushUndoSnapshot(snapshot = cloneSettingsSnapshot()) {
      const last = undoStack[undoStack.length - 1];
      if (!last || !snapshotsEqual(last, snapshot)) {
        undoStack.push(snapshot);
      }

      if (undoStack.length > HISTORY_LIMIT) {
        undoStack.shift();
      }

      redoStack.length = 0;
      cleanupHistoryImages();
      updateHistoryButtons();
    }

    function beginHistoryChange() {
      if (!pendingHistorySnapshot) {
        pendingHistorySnapshot = cloneSettingsSnapshot();
        pendingHistoryCommitted = false;
      }
    }

    function recordPendingHistoryChange() {
      if (
        pendingHistorySnapshot &&
        !pendingHistoryCommitted &&
        !snapshotsEqual(pendingHistorySnapshot, state)
      ) {
        pushUndoSnapshot(pendingHistorySnapshot);
        pendingHistoryCommitted = true;
      }
    }

    function commitHistoryChange() {
      if (!pendingHistorySnapshot) return;

      const snapshot = pendingHistorySnapshot;
      pendingHistorySnapshot = null;
      if (!pendingHistoryCommitted && !snapshotsEqual(snapshot, state)) {
        pushUndoSnapshot(snapshot);
      }
      pendingHistoryCommitted = false;
    }

    async function applySettingsSnapshot(snapshot) {
      Object.assign(state, createDefaultState(), expandSettingsSnapshot(snapshot));
      state.labelGap = clamp(state.labelGap, -3, 3);
      els.file.value = "";
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
      await saveSettings();
      updateHistoryButtons();
    }

    async function undoSettings() {
      commitHistoryChange();
      if (undoStack.length === 0) return;

      redoStack.push(cloneSettingsSnapshot());
      const previous = undoStack.pop();
      await applySettingsSnapshot(previous);
      cleanupHistoryImages();
    }

    async function redoSettings() {
      commitHistoryChange();
      if (redoStack.length === 0) return;

      undoStack.push(cloneSettingsSnapshot());
      const next = redoStack.pop();
      await applySettingsSnapshot(next);
      cleanupHistoryImages();
    }

    async function clearSettings() {
      try {
        const db = await openSettingsDb();
        await new Promise((resolve, reject) => {
          const request = db
            .transaction(DB_STORE, "readwrite")
            .objectStore(DB_STORE)
            .delete(DB_KEY);

          request.addEventListener("success", () => resolve());
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();
      } catch (error) {
        console.warn("설정 캐시를 지우지 못했습니다.", error);
      }
    }

    function getSelectedSlotKey() {
      return `slot-${activeSlotValue}`;
    }

    async function readSettingsKey(key) {
      const db = await openSettingsDb();
      const value = await new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE).objectStore(DB_STORE).get(key);
        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
      db.close();
      return value;
    }

    async function writeSettingsKey(key, value) {
      const db = await openSettingsDb();
      await new Promise((resolve, reject) => {
        const request = db
          .transaction(DB_STORE, "readwrite")
          .objectStore(DB_STORE)
          .put(value, key);

        request.addEventListener("success", () => resolve());
        request.addEventListener("error", () => reject(request.error));
      });
      db.close();
    }

    async function deleteSettingsKey(key) {
      const db = await openSettingsDb();
      await new Promise((resolve, reject) => {
        const request = db
          .transaction(DB_STORE, "readwrite")
          .objectStore(DB_STORE)
          .delete(key);

        request.addEventListener("success", () => resolve());
        request.addEventListener("error", () => reject(request.error));
      });
      db.close();
    }

    async function loadSlotLabels() {
      try {
        const labels = await readSettingsKey(SLOT_LABELS_KEY);
        slotLabels = labels && typeof labels === "object" ? labels : {};
      } catch (error) {
        console.warn("작업 탭 이름을 불러오지 못했습니다.", error);
        slotLabels = {};
      }
    }

    async function saveSlotLabels() {
      try {
        await writeSettingsKey(SLOT_LABELS_KEY, slotLabels);
      } catch (error) {
        console.warn("작업 탭 이름을 저장하지 못했습니다.", error);
        showStatus("작업 탭 이름을 저장하지 못했습니다.", "error");
      }
    }

    async function loadSlotTabs() {
      try {
        const cached = await readSettingsKey(SLOT_TABS_KEY);
        const validSlots = getSlotValues();
        const cachedOpenSlots = Array.isArray(cached?.openSlotValues)
          ? cached.openSlotValues.map(String).filter(slotValue => validSlots.includes(slotValue))
          : [];
        const cachedActiveSlot = validSlots.includes(String(cached?.activeSlotValue))
          ? String(cached.activeSlotValue)
          : "";

        openSlotValues = cachedOpenSlots.length ? cachedOpenSlots : [activeSlotValue];
        activeSlotValue = cachedActiveSlot || openSlotValues[0] || activeSlotValue;
        ensureSlotOpen(activeSlotValue);
        els.slotSelect.value = activeSlotValue;
      } catch (error) {
        console.warn("작업 탭 목록을 불러오지 못했습니다.", error);
        openSlotValues = [activeSlotValue];
      }
    }

    async function saveSlotTabs() {
      try {
        await writeSettingsKey(SLOT_TABS_KEY, {
          activeSlotValue,
          openSlotValues: getOpenSlotValues()
        });
      } catch (error) {
        console.warn("작업 탭 목록을 저장하지 못했습니다.", error);
        showStatus("작업 탭 목록을 저장하지 못했습니다.", "error");
      }
    }

    function normalizeSlotSnapshot(snapshot) {
      const normalized = {
        ...createDefaultState(),
        ...(snapshot || {})
      };
      delete normalized.savedAt;
      normalized.labelGap = clamp(normalized.labelGap, -3, 3);
      return normalized;
    }

    function getCurrentSlotSnapshot() {
      return normalizeSlotSnapshot(state);
    }

    function setActiveSlotBaseline(snapshot = state) {
      activeSlotBaselineSnapshot = normalizeSlotSnapshot(snapshot);
      renderSlotTabs();
    }

    function getSlotValues() {
      return Array.from(els.slotSelect.options).map(option => option.value);
    }

    function getOpenSlotValues() {
      return openSlotValues.filter(slotValue => getSlotValues().includes(String(slotValue)));
    }

    function ensureSlotOpen(slotValue) {
      const normalized = String(slotValue);
      if (!openSlotValues.includes(normalized)) {
        openSlotValues.push(normalized);
      }
    }

    function getDefaultSlotLabel(slotValue) {
      const option = Array.from(els.slotSelect.options)
        .find(item => item.value === String(slotValue));
      return option?.textContent || `작업 ${slotValue}`;
    }

    function isActiveSlotDirty() {
      return Boolean(
        activeSlotBaselineSnapshot &&
        !snapshotsEqual(activeSlotBaselineSnapshot, getCurrentSlotSnapshot())
      );
    }

    function renderSlotTabs() {
      if (!els.slotTabs) return;

      const activeIsDirty = isActiveSlotDirty();
      els.slotTabs.textContent = "";

      openSlotValues = getOpenSlotValues();
      if (!openSlotValues.length) {
        openSlotValues = [activeSlotValue];
      }

      openSlotValues.forEach(slotValue => {
        const tab = document.createElement("div");
        const isActive = String(slotValue) === String(activeSlotValue);

        tab.className = "workspace-tab";
        tab.dataset.slot = slotValue;
        tab.id = `slot-tab-${slotValue}`;
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", String(isActive));
        tab.setAttribute("tabindex", isActive ? "0" : "-1");
        const label = document.createElement("span");
        label.className = "workspace-tab-label";
        label.textContent = getSlotLabel(slotValue);
        label.title = isActive ? "한 번 더 눌러 이름 변경" : `${getSlotLabel(slotValue)} 열기`;

        const close = document.createElement("button");
        close.type = "button";
        close.className = "workspace-tab-close";
        close.title = `${getSlotLabel(slotValue)} 닫기`;
        close.setAttribute("aria-label", `${getSlotLabel(slotValue)} 닫기`);
        close.innerHTML = `
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 3l6 6M9 3 3 9" />
          </svg>
        `;
        close.addEventListener("click", event => {
          event.stopPropagation();
          clearSlot(slotValue);
        });

        tab.title = `${getSlotLabel(slotValue)} 열기`;

        if (isActive && activeIsDirty) {
          tab.classList.add("is-dirty");
          tab.title = `${getSlotLabel(slotValue)} - 저장되지 않은 변경 있음`;
        }

        const dirty = document.createElement("span");
        dirty.className = "workspace-tab-dirty";
        dirty.hidden = !(isActive && activeIsDirty);

        tab.addEventListener("click", event => {
          if (isActive) {
            if (event.target.closest(".workspace-tab-label")) {
              beginRenameSlot(tab, slotValue);
            }
            return;
          }

          changeSelectedSlot(slotValue);
        });
        tab.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          if (isActive) {
            beginRenameSlot(tab, slotValue);
            return;
          }

          changeSelectedSlot(slotValue);
        });

        tab.append(label, dirty, close);
        els.slotTabs.appendChild(tab);
      });
    }

    async function hasUnsavedChangesForSlot(slotValue) {
      if (String(slotValue) === String(activeSlotValue) && activeSlotBaselineSnapshot) {
        return !snapshotsEqual(activeSlotBaselineSnapshot, getCurrentSlotSnapshot());
      }

      const cached = await readSettingsKey(`slot-${slotValue}`);
      return !snapshotsEqual(
        normalizeSlotSnapshot(cached),
        getCurrentSlotSnapshot()
      );
    }

    function getSlotLabel(slotValue) {
      return slotLabels[String(slotValue)] || getDefaultSlotLabel(slotValue);
    }

    function beginRenameSlot(tab, slotValue) {
      const label = tab.querySelector(".workspace-tab-label");
      if (!label || tab.querySelector(".workspace-tab-name-input")) return;

      const previousName = getSlotLabel(slotValue);
      let isFinished = false;
      const input = document.createElement("input");
      input.className = "workspace-tab-name-input";
      input.type = "text";
      input.value = previousName;
      input.maxLength = 24;
      input.setAttribute("aria-label", `${previousName} 이름 변경`);

      const dirty = tab.querySelector(".workspace-tab-dirty");
      label.replaceWith(input);
      input.focus();
      input.select();

      async function commit() {
        if (isFinished) return;
        isFinished = true;
        const nextName = input.value.trim().slice(0, 24) || getDefaultSlotLabel(slotValue);
        if (nextName === previousName) {
          renderSlotTabs();
          return;
        }

        slotLabels[String(slotValue)] = nextName;
        await saveSlotLabels();
        renderSlotTabs();
        showStatus(`${nextName}(으)로 이름을 변경했습니다.`);
      }

      function cancel() {
        if (isFinished) return;
        isFinished = true;
        renderSlotTabs();
      }

      input.addEventListener("click", event => event.stopPropagation());
      input.addEventListener("keydown", event => {
        event.stopPropagation();
        if (event.key === "Enter") {
          event.preventDefault();
          commit();
          return;
        }

        if (event.key === "Escape") {
          event.preventDefault();
          cancel();
        }
      });
      input.addEventListener("blur", commit, { once: true });

    }

    async function changeSelectedSlot(nextValue) {
      const previousValue = activeSlotValue;
      if (String(nextValue) === String(previousValue)) return;

      try {
        const hasUnsaved = await hasUnsavedChangesForSlot(previousValue);
        if (hasUnsaved) {
          const shouldChange = window.confirm(
            `${getSlotLabel(previousValue)}에 현재 작업이 저장되어 있지 않습니다. ${getSlotLabel(nextValue)}로 변경할까요?`
          );

          if (!shouldChange) {
            els.slotSelect.value = previousValue;
            return;
          }
        }

        els.slotSelect.value = nextValue;
        activeSlotValue = String(nextValue);
        ensureSlotOpen(activeSlotValue);
        await saveSlotTabs();
        renderSlotTabs();
        const nextSlot = await readSettingsKey(`slot-${nextValue}`);
        if (!nextSlot) {
          applySlotSnapshot(createDefaultState());
          els.file.value = "";
          setActiveSlotBaseline();
          await saveSettings();
          showStatus(`${getSlotLabel(nextValue)}은 비어 있어 새 작업을 시작했습니다.`);
          return;
        }

        applySlotSnapshot(nextSlot);
        setActiveSlotBaseline(nextSlot);
        await saveSettings();
        showStatus(`${getSlotLabel(nextValue)}을 불러왔습니다.`);
      } catch (error) {
        console.warn("작업 탭 변경 확인에 실패했습니다.", error);
        els.slotSelect.value = previousValue;
        activeSlotValue = previousValue;
        renderSlotTabs();
        showStatus("작업 탭 상태를 확인하지 못했습니다.", "error");
      }
    }

    function applySlotSnapshot(snapshot) {
      pushUndoSnapshot();
      Object.assign(state, createDefaultState(), snapshot);
      state.labelGap = clamp(state.labelGap, -3, 3);
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
    }

    async function saveSelectedSlot() {
      const slotLabel = getSlotLabel(activeSlotValue);
      const shouldSave = window.confirm(`${slotLabel}에 현재 작업을 저장할까요? 기존 내용은 덮어씁니다.`);
      if (!shouldSave) return;

      try {
        await writeSettingsKey(getSelectedSlotKey(), {
          ...state,
          savedAt: new Date().toISOString()
        });
        setActiveSlotBaseline();
        showStatus(`${slotLabel}에 저장했습니다.`);
      } catch (error) {
        console.warn("작업 탭 저장에 실패했습니다.", error);
        showStatus("작업 탭에 저장하지 못했습니다.", "error");
      }
    }

    async function clearSlot(slotValue = activeSlotValue) {
      const isActive = String(slotValue) === String(activeSlotValue);
      const slotLabel = getSlotLabel(slotValue);

      try {
        const cached = await readSettingsKey(`slot-${slotValue}`);
        if (!cached) {
          if (isActive && isActiveSlotDirty()) {
            const shouldDiscard = window.confirm(`${slotLabel}의 현재 변경 내용을 버리고 빈 작업으로 돌아갈까요?`);
            if (!shouldDiscard) return;

            await closeActiveSlotAfterDelete(slotValue);
            showStatus(`${slotLabel}을 비웠습니다.`);
            return;
          }

          if (isActive) {
            await closeActiveSlotAfterDelete(slotValue);
          } else {
            openSlotValues = openSlotValues.filter(value => String(value) !== String(slotValue));
            await saveSlotTabs();
            renderSlotTabs();
          }
          showStatus(`${slotLabel}을 닫았습니다.`);
          return;
        }

        const shouldClear = window.confirm(`${slotLabel}에 저장된 작업을 삭제하고 탭을 비울까요?`);
        if (!shouldClear) return;

        await deleteSettingsKey(`slot-${slotValue}`);
        if (isActive) {
          await closeActiveSlotAfterDelete(slotValue);
        } else {
          openSlotValues = openSlotValues.filter(value => String(value) !== String(slotValue));
          await saveSlotTabs();
          renderSlotTabs();
        }
        showStatus(`${slotLabel}을 비웠습니다.`);
      } catch (error) {
        console.warn("작업 탭 초기화에 실패했습니다.", error);
        showStatus("작업 탭을 초기화하지 못했습니다.", "error");
      }
    }

    async function addSlotTab() {
      try {
        for (const slotValue of getSlotValues()) {
          const cached = await readSettingsKey(`slot-${slotValue}`);
          if (!cached && !openSlotValues.includes(String(slotValue))) {
            await changeSelectedSlot(slotValue);
            return;
          }
        }

        showStatus(`빈 작업 탭이 없습니다. 최대 ${SLOT_COUNT}개까지 사용할 수 있습니다.`, "error");
      } catch (error) {
        console.warn("빈 작업 탭을 찾지 못했습니다.", error);
        showStatus("새 작업 탭을 열지 못했습니다.", "error");
      }
    }

    async function closeActiveSlotAfterDelete(slotValue) {
      const closingIndex = openSlotValues.findIndex(value => String(value) === String(slotValue));
      openSlotValues = openSlotValues.filter(value => String(value) !== String(slotValue));

      if (openSlotValues.length) {
        const nextIndex = Math.min(Math.max(closingIndex, 0), openSlotValues.length - 1);
        activeSlotValue = openSlotValues[nextIndex];
        els.slotSelect.value = activeSlotValue;
        await saveSlotTabs();
        const nextSlot = await readSettingsKey(`slot-${activeSlotValue}`);
        applySlotSnapshot(nextSlot || createDefaultState());
        setActiveSlotBaseline(nextSlot || state);
        await saveSettings();
        return;
      }

      activeSlotValue = String(slotValue);
      openSlotValues = [activeSlotValue];
      els.slotSelect.value = activeSlotValue;
      await saveSlotTabs();
      applySlotSnapshot(createDefaultState());
      els.file.value = "";
      setActiveSlotBaseline();
      await saveSettings();
    }

    function handleEditorMenuCommand(command) {
      if (command === "new") {
        addSlotTab();
        return;
      }

      if (command === "save") {
        saveSelectedSlot();
        return;
      }

      if (command === "export") {
        exportSettingsJson();
        return;
      }

      if (command === "import") {
        els.importSettingsFile.click();
        return;
      }

      if (command === "undo") {
        undoSettings();
        return;
      }

      if (command === "redo") {
        redoSettings();
      }
    }

    async function createNewProject() {
      const shouldReset = window.confirm(
        "새로 만들기를 실행하면 저장된 이미지와 설정 캐시가 삭제됩니다. 계속할까요?"
      );
      if (!shouldReset) return;

      pushUndoSnapshot();
      await clearSettings();
      Object.assign(state, createDefaultState());
      els.file.value = "";
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
      setActiveSlotBaseline();
      await saveSettings();
      showStatus("새 작업을 시작했습니다.");
    }

    function exportSettingsJson() {
      const payload = {
        app: "clock-image-maker",
        version: 1,
        exportedAt: new Date().toISOString(),
        settings: { ...state }
      };

      const url = URL.createObjectURL(
        new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" })
      );
      const link = document.createElement("a");
      link.download = `clock-image-maker-${formatTime().replace(":", "-")}.json`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
      showStatus("설정 JSON을 다운로드했습니다.");
    }

    function importSettingsJson(file) {
      const reader = new FileReader();

      reader.addEventListener("load", async () => {
        try {
          const payload = JSON.parse(reader.result);

          if (
            payload?.app !== "clock-image-maker" ||
            payload?.version !== 1 ||
            !payload.settings ||
            typeof payload.settings !== "object"
          ) {
            throw new Error("지원하지 않는 설정 파일입니다.");
          }

          pushUndoSnapshot();
          Object.assign(state, createDefaultState(), payload.settings);
          syncControlsFromState();
          populateTimePicker();
          updateImageControlRange();
          render();
          setActiveSlotBaseline();
          await saveSettings();
          showStatus("설정 JSON을 불러왔습니다.");
        } catch (error) {
          showStatus(error.message || "설정 JSON을 불러오지 못했습니다.", "error");
        } finally {
          els.importSettingsFile.value = "";
        }
      });

      reader.addEventListener("error", () => {
        showStatus("설정 JSON 파일을 읽지 못했습니다.", "error");
        els.importSettingsFile.value = "";
      });

      reader.readAsText(file, "utf-8");
    }

    function syncControlsFromState() {
      [
        "imageX",
        "imageY",
        "imageScale",
        "labelText",
        "labelFont",
        "fontPreset",
        "labelFontSize",
        "labelFillColor",
        "labelStrokeColor",
        "labelGap",
        "labelOffset",
        "theme",
        "clockColor",
        "outsideColor",
        "outsideOpacity"
      ].forEach(key => {
        els[key].value = state[key];
      });

      updateFormatToggle(els.includeTime, state.includeTime);
      updateFormatToggle(els.dateMarkers, state.dateMarkers);
      updateFormatToggle(els.labelBold, state.labelBold);
      updateFormatToggle(els.labelItalic, state.labelItalic);
      updateFormatToggle(els.labelFillNone, state.labelFillNone);
      updateFormatToggle(els.labelStrokeNone, state.labelStrokeNone);
      updateCustomFontVisibility();
      updatePreviewZoom();
      syncSectionOpenStates();
    }

    function syncSectionOpenStates() {
      els.imageSection.open = Boolean(state.imageSectionOpen);
      els.clockSection.open = Boolean(state.clockSectionOpen);
      els.textSection.open = Boolean(state.textSectionOpen);
    }

    function updatePreviewZoom() {
      const isFit = state.previewZoom === "fit";
      const fitSize = getPreviewFitSize();

      els.previewFit.classList.toggle("is-active", isFit);
      els.previewFit.setAttribute("aria-pressed", String(isFit));

      if (isFit) {
        els.canvas.style.setProperty("--preview-size", `${fitSize}px`);
        els.previewZoomValue.textContent = "맞춤";
        return;
      }

      const zoom = clamp(state.previewZoom, Number(els.previewZoom.min), Number(els.previewZoom.max));
      const previewSize = Math.round(fitSize * (zoom / 100));

      state.previewZoom = zoom;
      els.previewZoom.value = zoom;
      els.previewZoomValue.textContent = `${zoom}%`;
      els.canvas.style.setProperty("--preview-size", `${previewSize}px`);
    }

    function getPreviewFitSize() {
      const rect = document.querySelector(".preview").getBoundingClientRect();
      const isMobile = window.matchMedia("(max-width: 760px)").matches;
      const widthPadding = isMobile ? 28 : 64;
      const heightPadding = isMobile ? 90 : 64;
      const availableWidth = Math.max(240, rect.width - widthPadding);
      const availableHeight = Math.max(240, rect.height - heightPadding);
      return Math.round(Math.min(availableWidth, availableHeight, 900));
    }

    function bindSectionOpenState(section, key) {
      section.addEventListener("toggle", () => {
        state[key] = section.open;
        saveSettings();
      });
    }

    function getLabelFontFamily() {
      const presets = {
        pretendard: "Pretendard, 'Noto Sans KR', sans-serif",
        notoSans: "'Noto Sans KR', sans-serif",
        notoSerif: "'Noto Serif KR', serif",
        blackHanSans: "'Black Han Sans', sans-serif",
        nanumGothic: "'Nanum Gothic', sans-serif",
        nanumPenScript: "'Nanum Pen Script', cursive",
        serif: "Georgia, 'Times New Roman', serif",
        monospace: "Consolas, monospace"
      };

      return state.fontPreset === "custom"
        ? state.labelFont
        : presets[state.fontPreset] || presets.pretendard;
    }

    function getLabelFontWeight() {
      return state.labelBold ? 900 : 400;
    }

    function getLabelGeometry(clockDiameter = 100) {
      const radiusPercent = LABEL_RADIUS_BASE_PERCENT + Number(state.labelGap);
      const fontSizePercent = LABEL_FONT_SIZE_PERCENT * (state.labelFontSize / 100);
      const strokeWidthPercent = state.labelFillNone
        ? LABEL_STROKE_ONLY_PERCENT
        : LABEL_STROKE_WITH_FILL_PERCENT;

      return {
        radiusPercent,
        radius: clockDiameter * (radiusPercent / 100),
        startOffsetPercent: LABEL_START_OFFSET_BASE_PERCENT + Number(state.labelOffset),
        centerAngle: -Math.PI / 2 + (Number(state.labelOffset) * LABEL_OFFSET_TO_ANGLE_RATIO),
        fontSizePercent,
        fontSize: clockDiameter * (fontSizePercent / 100),
        strokeWidthPercent,
        strokeWidth: clockDiameter * (strokeWidthPercent / 100)
      };
    }

    function getLabelFontCss(fontSize) {
      return `${state.labelItalic ? "italic " : ""}${getLabelFontWeight()} ${fontSize}px ${getLabelFontFamily()}`;
    }

    function updateCustomFontVisibility() {
      els.customFontField.hidden = state.fontPreset !== "custom";
    }

    function updateFormatToggle(button, isActive) {
      button.classList.toggle("is-active", isActive);
      button.setAttribute("aria-pressed", String(isActive));
    }

    function setSettingsDrawerOpen(isOpen) {
      els.settingsPanel.classList.toggle("is-open", isOpen);
      els.drawerOverlay.classList.toggle("is-visible", isOpen);
      els.menuToggle.setAttribute("aria-expanded", String(isOpen));
      els.menuToggle.setAttribute("aria-label", isOpen ? "설정 닫기" : "설정 열기");
      els.menuToggleIcon.textContent = isOpen ? "<" : ">";
      document.body.classList.toggle("drawer-open", isOpen);
    }

    function toggleSettingsDrawer() {
      setSettingsDrawerOpen(!els.settingsPanel.classList.contains("is-open"));
    }

    function closeSettingsDrawer() {
      setSettingsDrawerOpen(false);
    }

    function bindSettingsDrawerGestures() {
      let swipeStart = null;

      window.addEventListener("touchstart", event => {
        if (!window.matchMedia("(max-width: 760px)").matches) return;
        const touch = event.touches[0];
        if (!touch) return;

        const drawerOpen = els.settingsPanel.classList.contains("is-open");
        if (!drawerOpen && touch.clientX > 36) {
          swipeStart = null;
          return;
        }

        swipeStart = {
          x: touch.clientX,
          y: touch.clientY,
          drawerOpen
        };
      }, { passive: true });

      window.addEventListener("touchend", event => {
        if (!swipeStart) return;

        const touch = event.changedTouches[0];
        if (!touch) {
          swipeStart = null;
          return;
        }

        const deltaX = touch.clientX - swipeStart.x;
        const deltaY = touch.clientY - swipeStart.y;
        swipeStart = null;

        if (Math.abs(deltaX) < 54 || Math.abs(deltaX) < Math.abs(deltaY) * 1.35) return;

        if (deltaX > 0) {
          setSettingsDrawerOpen(true);
          return;
        }

        setSettingsDrawerOpen(false);
      }, { passive: true });
    }

    function getClockColor() {
      return state.clockColor || themes[state.theme].color;
    }

    function getRingBorder(theme) {
      return `${theme.ring.widthPx}px ${theme.ring.style} ${getClockColor()}`;
    }

    function getTickType(theme) {
      return theme.ticks?.type || "bar";
    }

    function getHandType(theme) {
      return theme.hands?.type || "round";
    }

    function getHandWidthPercent(theme, name) {
      const handType = getHandType(theme);

      if (handType === "round") return name === "hour" ? 2.5 : 1.5;
      if (handType === "diamond") return name === "hour" ? 3.2 : 2.1;
      if (handType === "thin") return name === "hour" ? 1.1 : 0.75;
      if (handType === "taper") return name === "hour" ? 2.8 : 1.8;
      return name === "hour" ? 2.5 : 1.5;
    }

    function getDateMarkerFontSize(faceDiameter) {
      return Math.max(12, faceDiameter * 0.062);
    }

    function getDateMarkerRadiusPercents(theme = themes[state.theme]) {
      if (getTickType(theme) === "none") {
        const outwardOffset = 8;
        return {
          month: MONTH_MARKER_LENGTH_PERCENT + outwardOffset,
          day: MINUTE_HAND_LENGTH_PERCENT + outwardOffset
        };
      }

      return {
        month: MONTH_MARKER_LENGTH_PERCENT,
        day: MINUTE_HAND_LENGTH_PERCENT
      };
    }

    function getDateMarkerPositions(faceDiameter) {
      const center = faceDiameter / 2;
      const markerRadius = getDateMarkerRadiusPercents();
      const hourAngle = (((state.hour % 12) * 30) + (state.minute * 0.5) - 90) * Math.PI / 180;
      const minuteAngle = ((state.minute * 6) - 90) * Math.PI / 180;

      return [
        {
          type: "month",
          text: `${state.hour}월`,
          x: center + Math.cos(hourAngle) * (faceDiameter * (markerRadius.month / 100)),
          y: center + Math.sin(hourAngle) * (faceDiameter * (markerRadius.month / 100))
        },
        {
          type: "day",
          text: `${state.minute}일`,
          x: center + Math.cos(minuteAngle) * (faceDiameter * (markerRadius.day / 100)),
          y: center + Math.sin(minuteAngle) * (faceDiameter * (markerRadius.day / 100))
        }
      ];
    }

    function render() {
      const theme = themes[state.theme];

      const ringSize = RING_SIZE;
      els.clock.innerHTML = "";
      renderSlotTabs();
      updateRangeValues();
      updatePreviewZoom();
      updateDownloadButtonText();

      els.clock.style.setProperty("--clock-size", `${DEFAULT_CLOCK_SIZE}%`);
      els.clock.style.setProperty("--ring-size", `${ringSize}%`);
      els.bg.style.backgroundImage = state.imageUrl
        ? "none"
        : "linear-gradient(135deg, #642020, #2d2d2d)";

      els.bgImg.src = state.imageUrl;
      els.bgImg.style.display = state.imageUrl ? "block" : "none";
      els.bg.style.setProperty("--image-x", `${state.imageX}px`);
      els.bg.style.setProperty("--image-y", `${state.imageY}px`);
      els.bg.style.setProperty("--image-scale", state.imageScale / 100);

      updateOutsideMask(DEFAULT_CLOCK_SIZE, ringSize);

      const face = document.createElement("div");
      face.className = "face";
      face.style.border = getRingBorder(theme);
      face.style.setProperty("--clock-color", getClockColor());
      els.clock.appendChild(face);

      createCurvedLabel(els.clock);
      createTicks(face, theme);
      if (state.dateMarkers) {
        createDateMarkers(face);
      } else {
        createHands(face, theme);
      }

      if (theme.centerDot) {
        createCenterDot(face, getClockColor());
      }
    }

    function updateRangeValues() {
      els.imageScaleValue.textContent = `${state.imageScale}%`;
      els.imageXValue.textContent = `${state.imageX}px`;
      els.imageYValue.textContent = `${state.imageY}px`;
      els.labelGapValue.textContent = `${state.labelGap}`;
      els.labelOffsetValue.textContent = `${state.labelOffset}`;
    }

    function updateImageControlRange() {
      const canvasSize = document.querySelector(".canvas").getBoundingClientRect().width;
      const renderedSize = canvasSize * (state.imageScale / 100);
      const limit = Math.round(renderedSize / 3);

      els.imageX.min = -limit;
      els.imageX.max = limit;

      els.imageY.min = -limit;
      els.imageY.max = limit;

      state.imageX = Math.max(-limit, Math.min(limit, state.imageX));
      state.imageY = Math.max(-limit, Math.min(limit, state.imageY));

      els.imageX.value = state.imageX;
      els.imageY.value = state.imageY;
    }

    function syncImagePositionControls() {
      els.imageX.value = state.imageX;
      els.imageY.value = state.imageY;
      updateRangeValues();
    }

    function clampImagePosition() {
      state.imageX = clamp(state.imageX, Number(els.imageX.min), Number(els.imageX.max));
      state.imageY = clamp(state.imageY, Number(els.imageY.min), Number(els.imageY.max));
    }

    function bindImageDrag() {
      let drag = null;
      let dragDepth = 0;

      els.canvas.addEventListener("pointerdown", event => {
        if (!state.imageUrl) return;

        beginHistoryChange();
        drag = {
          startX: event.clientX,
          startY: event.clientY,
          imageX: state.imageX,
          imageY: state.imageY
        };

        els.canvas.classList.add("is-dragging");
        els.canvas.setPointerCapture(event.pointerId);
      });

      els.canvas.addEventListener("dragstart", event => {
        event.preventDefault();
      });

      els.canvas.addEventListener("dragenter", event => {
        if (!hasDataTransferImage(event.dataTransfer)) return;

        event.preventDefault();
        dragDepth += 1;
        els.canvas.classList.add("is-drop-target");
      });

      els.canvas.addEventListener("dragover", event => {
        if (!hasDataTransferImage(event.dataTransfer)) return;

        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
      });

      els.canvas.addEventListener("dragleave", event => {
        if (!hasDataTransferImage(event.dataTransfer)) return;

        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) {
          els.canvas.classList.remove("is-drop-target");
        }
      });

      els.canvas.addEventListener("drop", event => {
        const file = getDataTransferImageFile(event.dataTransfer);
        if (!file) return;

        event.preventDefault();
        dragDepth = 0;
        els.canvas.classList.remove("is-drop-target");
        applyImageFile(file, {
          notify: true,
          message: "드롭한 이미지가 적용되었습니다."
        });
      });

      els.canvas.addEventListener("pointermove", event => {
        if (!drag) return;

        state.imageX = Math.round(drag.imageX + event.clientX - drag.startX);
        state.imageY = Math.round(drag.imageY + event.clientY - drag.startY);
        clampImagePosition();
        syncImagePositionControls();
        render();
        recordPendingHistoryChange();
      });

      function endDrag(event) {
        if (!drag) return;

        drag = null;
        els.canvas.classList.remove("is-dragging");
        if (els.canvas.hasPointerCapture(event.pointerId)) {
          els.canvas.releasePointerCapture(event.pointerId);
        }
        commitHistoryChange();
        saveSettings({ notify: true });
      }

      els.canvas.addEventListener("pointerup", endDrag);
      els.canvas.addEventListener("pointercancel", endDrag);
      els.canvas.addEventListener("lostpointercapture", () => {
        if (!drag) return;
        drag = null;
        els.canvas.classList.remove("is-dragging");
        commitHistoryChange();
        saveSettings({ notify: true });
      });
    }

    function updateOutsideMask(clockSize, ringSize) {
      const canvasSize = document.querySelector(".canvas").getBoundingClientRect().width;
      const radius = canvasSize * (clockSize / 100) * (ringSize / 100) / 2;
      const centerX = canvasSize / 2;
      const centerY = canvasSize * (CLOCK_CENTER_Y / 100);

      els.outsideMask.style.background = state.outsideColor;
      els.outsideMask.style.opacity = state.outsideOpacity;

      els.outsideMask.style.mask = `
        radial-gradient(
          circle ${radius}px at ${centerX}px ${centerY}px,
          transparent 0 ${radius}px,
          black ${radius + 1}px
        )
      `;

      els.outsideMask.style.webkitMask = els.outsideMask.style.mask;
    }

    function createCurvedLabel(parent) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const geometry = getLabelGeometry();

      svg.classList.add("label-svg");
      svg.setAttribute("viewBox", "0 0 100 100");

      svg.innerHTML = `
    <defs>
      <path id="labelPath" d="M ${50 - geometry.radius} 50 A ${geometry.radius} ${geometry.radius} 0 0 1 ${50 + geometry.radius} 50" />
    </defs>

    <text
      font-family="${escapeAttr(getLabelFontFamily())}"
      font-weight="${getLabelFontWeight()}"
      font-style="${state.labelItalic ? "italic" : "normal"}"
      font-size="${geometry.fontSize}"
      fill="${escapeAttr(state.labelFillNone ? "transparent" : state.labelFillColor)}"
      stroke="${escapeAttr(state.labelStrokeNone ? "transparent" : state.labelStrokeColor)}"
      stroke-width="${geometry.strokeWidth}">
      <textPath
        href="#labelPath"
        startOffset="${geometry.startOffsetPercent}%"
        text-anchor="middle">
        ${escapeHTML(getLabelText())}
      </textPath>
    </text>
  `;

      parent.appendChild(svg);
    }

    function createTicks(parent, theme) {
      const tickType = getTickType(theme);
      if (tickType === "none") return;

      const radius = TICK_RADIUS_PERCENT;

      for (let i = 0; i < 12; i++) {
        const angle = i * 30;
        const rad = angle * Math.PI / 180;

        const tick = document.createElement("div");
        tick.className = "tick";

        tick.style.left = `${50 + Math.sin(rad) * radius}%`;
        tick.style.top = `${50 - Math.cos(rad) * radius}%`;
        tick.style.background = getClockColor();

        if (tickType === "bar") {
          tick.style.width = `${BAR_TICK_WIDTH_PERCENT}%`;
          tick.style.height = `${BAR_TICK_HEIGHT_PERCENT}%`;
          tick.style.borderRadius = "999px";
          tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        if (tickType === "dot") {
          tick.style.width = `${DOT_TICK_SIZE_PERCENT}%`;
          tick.style.height = `${DOT_TICK_SIZE_PERCENT}%`;
          tick.style.borderRadius = "50%";
          tick.style.transform = "translate(-50%, -50%)";
        }

        parent.appendChild(tick);
      }
    }

    function createHands(parent, theme) {
      const hourAngle = ((state.hour % 12) * 30) + (state.minute * 0.5);
      const minuteAngle = state.minute * 6;

      createHand(parent, "hour", hourAngle, HOUR_HAND_LENGTH_PERCENT, theme);
      createHand(parent, "minute", minuteAngle, MINUTE_HAND_LENGTH_PERCENT, theme);
    }

    function createDateMarkers(parent) {
      getDateMarkerPositions(100).forEach(marker => {
        const element = document.createElement("div");
        element.className = `date-marker date-marker-${marker.type}`;
        element.textContent = marker.text;
        element.style.left = `${marker.x}%`;
        element.style.top = `${marker.y}%`;
        parent.appendChild(element);
      });
    }

    function createHand(parent, name, angle, length, theme) {
      const handType = getHandType(theme);
      const hand = document.createElement("div");
      hand.className = `hand ${name}`;
      hand.style.height = `${length}%`;
      hand.style.background = getClockColor();
      hand.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;

      if (handType === "round") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.borderRadius = "999px";
      }

      if (handType === "diamond") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.clipPath = "polygon(50% 0%, 100% 88%, 50% 100%, 0% 88%)";
      }

      if (handType === "thin") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.borderRadius = "999px";
      }

      if (handType === "taper") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.clipPath = "polygon(50% 0%, 82% 100%, 18% 100%)";
      }

      parent.appendChild(hand);
    }

    function createCenterDot(parent, color) {
      const dot = document.createElement("div");
      dot.className = "center-dot";
      dot.style.background = color;
      parent.appendChild(dot);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHTML(value).replace(/`/g, "&#096;");
    }

    function isImageFile(file) {
      const hasImageType = /^image\//i.test(file?.type || "");
      const hasImageName = /\.(avif|bmp|gif|jpe?g|png|webp)$/i.test(file?.name || "");
      return Boolean(file && (hasImageType || hasImageName));
    }

    function hasDataTransferImage(dataTransfer) {
      const items = Array.from(dataTransfer?.items || []);
      if (items.some(item => item.kind === "file" && /^image\//i.test(item.type || ""))) {
        return true;
      }

      return Array.from(dataTransfer?.files || []).some(isImageFile);
    }

    function applyImageFile(file, options = {}) {
      const { notify = false, message = "이미지가 적용되었습니다." } = options;
      if (!isImageFile(file)) {
        showStatus("이미지 파일을 찾지 못했습니다.", "error", 1800);
        return;
      }

      const reader = new FileReader();
      reader.addEventListener("load", () => {
        pushUndoSnapshot();
        state.imageUrl = reader.result;
        state.imageMime = file.type || "";
        els.file.value = "";
        render();
        updateImageControlRange();
        saveSettings();
        if (notify) {
          showStatus(message, "info", 1600);
        }
      });
      reader.addEventListener("error", () => {
        showStatus("이미지를 불러오지 못했습니다.", "error", 2200);
      });
      reader.readAsDataURL(file);
    }

    function getDataTransferImageFile(dataTransfer) {
      const items = Array.from(dataTransfer?.items || []);
      const imageItem = items.find(item =>
        item.kind === "file" && /^image\//i.test(item.type || "")
      );
      const itemFile = imageItem?.getAsFile();
      if (isImageFile(itemFile)) return itemFile;

      return Array.from(dataTransfer?.files || []).find(isImageFile) || null;
    }

    function getClipboardImageFile(event) {
      return getDataTransferImageFile(event.clipboardData);
    }

    function handleClipboardPaste(event) {
      const file = getClipboardImageFile(event);
      if (!file) return;

      event.preventDefault();
      applyImageFile(file, {
        notify: true,
        message: "클립보드 이미지가 붙여넣어졌습니다."
      });
    }

    function bindControls() {
      els.file.addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;
        applyImageFile(file);
      });

      populateTimePicker();

      [els.pickerHour, els.pickerMinute].forEach(select => {
        select.addEventListener("input", () => {
          pushUndoSnapshot();
          state.hour = Number(els.pickerHour.value);
          state.minute = Number(els.pickerMinute.value);
          render();
          saveSettings();
        });
      });

      els.fontPreset.addEventListener("input", event => {
        pushUndoSnapshot();
        state.fontPreset = event.target.value;
        updateCustomFontVisibility();
        render();
        saveSettings();
      });

      [
        [els.includeTime, "includeTime"],
        [els.dateMarkers, "dateMarkers"],
        [els.labelBold, "labelBold"],
        [els.labelItalic, "labelItalic"],
        [els.labelFillNone, "labelFillNone"],
        [els.labelStrokeNone, "labelStrokeNone"]
      ].forEach(([button, key]) => {
        button.addEventListener("click", () => {
          pushUndoSnapshot();
          state[key] = !state[key];
          updateFormatToggle(button, state[key]);
          render();
          saveSettings();
        });
      });

      const bindings = [
        ["imageX", "number"],
        ["imageY", "number"],
        ["imageScale", "number"],
        ["labelText", "text"],
        ["labelFont", "text"],
        ["labelFontSize", "number"],
        ["labelFillColor", "text"],
        ["labelStrokeColor", "text"],
        ["labelGap", "number"],
        ["labelOffset", "number"],
        ["theme", "text"],
        ["clockColor", "text"],
        ["outsideColor", "text"],
        ["outsideOpacity", "number"]
      ];

      bindings.forEach(([key, type]) => {
        els[key].addEventListener("focus", beginHistoryChange);
        els[key].addEventListener("pointerdown", beginHistoryChange);
        els[key].addEventListener("change", () => {
          commitHistoryChange();
          saveSettings({ notify: true });
        });
        els[key].addEventListener("input", event => {
          beginHistoryChange();
          state[key] = type === "number"
            ? Number(event.target.value)
            : event.target.value;

          render();
          recordPendingHistoryChange();

          // 확대가 바뀌면 이동범위 재계산
          if (key === "imageScale") {
            updateImageControlRange();
            render();
          }

          saveSettings();
        });
      });

      els.download.addEventListener("click", event => {
        event.stopPropagation();
        toggleExportFormatMenu();
      });
      els.exportFormatList.querySelectorAll("[data-export-format]").forEach(button => {
        button.addEventListener("click", () => {
          pushUndoSnapshot();
          state.exportFormat = button.dataset.exportFormat;
          closeExportFormatMenu();
          render();
          saveSettings({ notify: true });
          downloadImage();
        });
      });
      els.importSettingsFile.addEventListener("change", event => {
        const file = event.target.files[0];
        if (file) importSettingsJson(file);
      });
      els.previewFit.addEventListener("click", () => {
        state.previewZoom = "fit";
        updatePreviewZoom();
        updateImageControlRange();
        render();
        saveSettings();
      });
      els.previewZoom.addEventListener("input", event => {
        state.previewZoom = Number(event.target.value);
        updatePreviewZoom();
        updateImageControlRange();
        render();
      });
      els.previewZoom.addEventListener("change", () => {
        saveSettings({ notify: true });
      });
      els.editorMenubar.addEventListener("click", event => {
        const button = event.target.closest("[data-menu-command]");
        if (!button || button.disabled) return;
        handleEditorMenuCommand(button.dataset.menuCommand);
      });
      els.slotSelect.addEventListener("change", event => {
        changeSelectedSlot(event.target.value);
      });
      els.menuToggle.addEventListener("click", toggleSettingsDrawer);
      els.drawerOverlay.addEventListener("click", closeSettingsDrawer);
      bindSettingsDrawerGestures();
      bindSectionOpenState(els.imageSection, "imageSectionOpen");
      bindSectionOpenState(els.clockSection, "clockSectionOpen");
      bindSectionOpenState(els.textSection, "textSectionOpen");
      window.addEventListener("keydown", handleKeyboardShortcuts);
      document.addEventListener("paste", handleClipboardPaste);
      document.addEventListener("click", event => {
        if (!els.exportFormatMenu.contains(event.target)) {
          closeExportFormatMenu();
        }
      });
      window.addEventListener("resize", () => {
        if (window.matchMedia("(min-width: 761px)").matches) {
          closeSettingsDrawer();
        }
        updateImageControlRange();
        render();
      });
      bindImageDrag();
    }

    function handleKeyboardShortcuts(event) {
      if (event.key === "Escape") {
        closeSettingsDrawer();
        closeExportFormatMenu();
        return;
      }

      if (!event.ctrlKey || event.altKey || event.metaKey) return;

      const key = event.key.toLowerCase();

      if (key === "s") {
        event.preventDefault();
        downloadImage();
        return;
      }

      if (key === "o") {
        event.preventDefault();
        els.file.click();
        return;
      }

      if (key === "n") {
        event.preventDefault();
        createNewProject();
