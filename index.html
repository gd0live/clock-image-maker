        return;
      }

      if (/^[1-6]$/.test(key)) {
        event.preventDefault();
        if (openSlotValues.includes(key)) {
          changeSelectedSlot(key);
        }
        return;
      }

      if (key === "z" && event.shiftKey) {
        event.preventDefault();
        redoSettings();
        return;
      }

      if (key === "z") {
        event.preventDefault();
        undoSettings();
        return;
      }

      if (key === "y") {
        event.preventDefault();
        redoSettings();
      }
    }

    async function downloadImage() {
      if (isExporting) {
        showStatus("저장 작업이 끝난 뒤 다시 시도하세요.", "error", 1800);
        return;
      }

      isExporting = true;
      closeExportFormatMenu();
      updateDownloadBusyState();

      try {
        const format = getExportFormat();

        if (format === "webm") {
          await downloadWebm();
          return;
        }

        await downloadPng();
      } finally {
        isExporting = false;
        updateDownloadBusyState();
      }
    }

    async function downloadPng() {
      render();
      await waitForExportAssets();

      const size = Number(els.exportSize.value);
      const output = document.createElement("canvas");
      output.width = size;
      output.height = size;

      const context = output.getContext("2d");
      drawExportScene(context, size);

      const blob = await new Promise(resolve => output.toBlob(resolve, "image/png"));
      if (!blob) {
        showStatus("PNG 이미지를 만들지 못했습니다.", "error");
        return;
      }

      const didSave = await saveBlob(blob, getPngFilename(), "PNG 이미지", "image/png", ".png");
      if (didSave) {
        showStatus("PNG 저장을 완료했습니다.");
      }
    }

    async function downloadWebm() {
      if (!HTMLCanvasElement.prototype.captureStream || !("MediaRecorder" in window)) {
        showStatus("이 브라우저에서는 동영상 저장을 지원하지 않습니다.", "error");
        return;
      }

      if (isGifImage() && !("ImageDecoder" in window)) {
        showStatus("이 브라우저에서는 GIF 배경 동영상 저장을 지원하지 않습니다. Chrome 또는 Edge에서 다시 시도하세요.", "error");
        return;
      }

      render();
      await waitForExportAssets();
      showStatus("동영상을 녹화하는 중입니다...");

      try {
        const size = Number(els.exportSize.value);
        const output = document.createElement("canvas");
        output.width = size;
        output.height = size;
        const context = output.getContext("2d");
        const stream = output.captureStream(30);
        const mimeType = getSupportedVideoMimeType();
        const chunks = [];
        const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        const stopped = new Promise(resolve => {
          recorder.addEventListener("stop", resolve, { once: true });
        });

        recorder.addEventListener("dataavailable", event => {
          if (event.data?.size) chunks.push(event.data);
        });

        recorder.start();

        if (isGifImage()) {
          await forEachGifFrame(async ({ image, index, frameCount, durationUs, isLast }) => {
            context.clearRect(0, 0, size, size);
            drawExportScene(context, size, image);
            const durationMs = Math.max(20, Math.round(durationUs / 1000));
            await new Promise(resolve => setTimeout(resolve, durationMs));

            if (index % 5 === 0 || isLast) {
              showStatus(`동영상 녹화 중... ${index + 1}/${frameCount || "?"}`);
            }
          });
        } else {
          drawExportScene(context, size);
          await new Promise(resolve => setTimeout(resolve, 2000));
        }

        recorder.stop();
        await stopped;
        stream.getTracks().forEach(track => track.stop());

        const blob = new Blob(chunks, { type: mimeType || "video/webm" });
        const didSave = await saveBlob(blob, getWebmFilename(), "WEBM 동영상", "video/webm", ".webm");
        if (didSave) {
          showStatus("동영상 저장을 완료했습니다.");
        }
      } catch (error) {
        console.error(error);
        showStatus("동영상을 만들지 못했습니다.", "error");
      }
    }

    function drawExportScene(context, size, backgroundImage = null) {
      const theme = themes[state.theme];
      const screenSize = $("canvas").getBoundingClientRect().width || size;
      const scale = size / screenSize;
      const centerX = size / 2;
      const centerY = size * (CLOCK_CENTER_Y / 100);
      const clockDiameter = size * (DEFAULT_CLOCK_SIZE / 100);
      const ringRadius = clockDiameter * (RING_SIZE / 100) / 2;

      drawExportBackground(context, size, scale, backgroundImage);
      drawExportOutsideMask(context, size, centerX, centerY, ringRadius);
      drawExportRing(context, theme, centerX, centerY, ringRadius, size);
      drawExportTicks(context, theme, centerX, centerY, ringRadius, size);
      drawExportHands(context, theme, centerX, centerY, ringRadius, size);
      drawExportLabel(context, centerX, centerY, clockDiameter);
    }

    async function waitForExportAssets() {
      if (document.fonts?.ready) {
        await document.fonts.ready;
      }

      if (!state.imageUrl || !els.bgImg.src || els.bgImg.complete) return;

      await new Promise(resolve => {
        const done = () => {
          els.bgImg.removeEventListener("load", done);
          els.bgImg.removeEventListener("error", done);
          resolve();
        };

        els.bgImg.addEventListener("load", done, { once: true });
        els.bgImg.addEventListener("error", done, { once: true });
      });
    }

    async function saveBlob(blob, filename, description, mimeType, extension) {
      if ("showSaveFilePicker" in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description,
              accept: { [mimeType]: [extension] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (error) {
          if (error.name === "AbortError") return false;
          console.warn("파일 저장 선택기를 사용할 수 없어 다운로드 방식으로 전환합니다.", error);
        }
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return true;
    }

    function drawExportBackground(context, size, scale, sourceImage = null) {
      const image = sourceImage || els.bgImg;
      const naturalWidth = image?.naturalWidth || image?.displayWidth || image?.videoWidth || image?.width || 0;
      const naturalHeight = image?.naturalHeight || image?.displayHeight || image?.videoHeight || image?.height || 0;

      if (!sourceImage && (!state.imageUrl || !els.bgImg.complete || !els.bgImg.naturalWidth)) {
        const gradient = context.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, "#642020");
        gradient.addColorStop(1, "#2d2d2d");
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        return;
      }

      if (!naturalWidth || !naturalHeight) return;

      context.fillStyle = "#333333";
      context.fillRect(0, 0, size, size);

      const containScale = Math.min(size / naturalWidth, size / naturalHeight);
      const imageScale = containScale * (state.imageScale / 100);
      const width = naturalWidth * imageScale;
      const height = naturalHeight * imageScale;
      const x = ((size - width) / 2) + (state.imageX * scale);
      const y = ((size - height) / 2) + (state.imageY * scale);

      context.drawImage(image, x, y, width, height);
    }

    function drawExportOutsideMask(context, size, centerX, centerY, radius) {
      context.save();
      context.fillStyle = state.outsideColor;
      context.globalAlpha = state.outsideOpacity;
      context.beginPath();
      context.rect(0, 0, size, size);
      context.arc(centerX, centerY, radius, 0, Math.PI * 2);
      context.fill("evenodd");
      context.restore();
    }

    function drawExportRing(context, theme, centerX, centerY, radius, size) {
      const color = getClockColor();
      const ring = theme.ring;

      context.save();
      context.strokeStyle = color;
      context.lineWidth = size * ring.widthPercent;
      context.beginPath();
      context.arc(centerX, centerY, radius, 0, Math.PI * 2);
      context.stroke();

      if (ring.style === "double") {
        context.lineWidth = size * ring.innerWidthPercent;
        context.beginPath();
        context.arc(centerX, centerY, radius - (size * ring.innerInsetPercent), 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();
    }

    function drawExportTicks(context, theme, centerX, centerY, radius, size) {
      const tickType = getTickType(theme);
      if (tickType === "none") return;

      const color = getClockColor();

      context.save();
      context.strokeStyle = color;
      context.fillStyle = color;
      context.lineCap = "round";

      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const faceDiameter = radius * 2;
        const tickCenterRadius = faceDiameter * (TICK_RADIUS_PERCENT / 100);

        if (tickType === "dot") {
          context.beginPath();
          context.arc(
            centerX + Math.cos(angle) * tickCenterRadius,
            centerY + Math.sin(angle) * tickCenterRadius,
            faceDiameter * (DOT_TICK_SIZE_PERCENT / 100) / 2,
            0,
            Math.PI * 2
          );
          context.fill();
          continue;
        }

        context.lineWidth = faceDiameter * (BAR_TICK_WIDTH_PERCENT / 100);
        const tickHalfLength = faceDiameter * (BAR_TICK_HEIGHT_PERCENT / 100) / 2;
        context.beginPath();
        context.moveTo(
          centerX + Math.cos(angle) * (tickCenterRadius + tickHalfLength),
          centerY + Math.sin(angle) * (tickCenterRadius + tickHalfLength)
        );
        context.lineTo(
          centerX + Math.cos(angle) * (tickCenterRadius - tickHalfLength),
          centerY + Math.sin(angle) * (tickCenterRadius - tickHalfLength)
        );
        context.stroke();
      }
      context.restore();
    }

    function drawExportHands(context, theme, centerX, centerY, radius, size) {
      if (state.dateMarkers) {
        drawExportDateMarkers(context, centerX, centerY, radius);

        if (theme.centerDot) {
          context.save();
          context.fillStyle = getClockColor();
          context.beginPath();
          context.arc(centerX, centerY, radius * 2 * (CENTER_DOT_SIZE_PERCENT / 100) / 2, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }

        return;
      }

      const hourAngle = (((state.hour % 12) * 30) + (state.minute * 0.5) - 90) * Math.PI / 180;
      const minuteAngle = ((state.minute * 6) - 90) * Math.PI / 180;

      const faceDiameter = radius * 2;
      drawExportHand(
        context,
        theme,
        centerX,
        centerY,
        faceDiameter * (HOUR_HAND_LENGTH_PERCENT / 100),
        hourAngle,
        faceDiameter * (getHandWidthPercent(theme, "hour") / 100)
      );
      drawExportHand(
        context,
        theme,
        centerX,
        centerY,
        faceDiameter * (MINUTE_HAND_LENGTH_PERCENT / 100),
        minuteAngle,
        faceDiameter * (getHandWidthPercent(theme, "minute") / 100)
      );

      if (theme.centerDot) {
        context.save();
        context.fillStyle = getClockColor();
        context.beginPath();
        context.arc(centerX, centerY, faceDiameter * (CENTER_DOT_SIZE_PERCENT / 100) / 2, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    function drawExportDateMarkers(context, centerX, centerY, radius) {
      const faceDiameter = radius * 2;
      const fontSize = getDateMarkerFontSize(faceDiameter);

      context.save();
      context.font = `900 ${fontSize}px Pretendard, "Noto Sans KR", sans-serif`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.lineJoin = "round";
      context.lineWidth = Math.max(2, fontSize * 0.14);
      context.strokeStyle = "rgba(0, 0, 0, 0.72)";
      context.fillStyle = getClockColor();

      getDateMarkerPositions(faceDiameter).forEach(marker => {
        const x = centerX - radius + marker.x;
        const y = centerY - radius + marker.y;
        context.strokeText(marker.text, x, y);
        context.fillText(marker.text, x, y);
      });

      context.restore();
    }

    function drawExportHand(context, theme, centerX, centerY, length, angle, width) {
      const handType = getHandType(theme);

      context.save();
      context.translate(centerX, centerY);
      context.rotate(angle + Math.PI / 2);
      context.fillStyle = getClockColor();
      context.strokeStyle = getClockColor();

      if (handType === "diamond") {
        context.beginPath();
        context.moveTo(0, -length);
        context.lineTo(width / 2, -length * 0.12);
        context.lineTo(0, 0);
        context.lineTo(-width / 2, -length * 0.12);
        context.closePath();
        context.fill();
      } else if (handType === "taper") {
        context.beginPath();
        context.moveTo(0, -length);
        context.lineTo(width * 0.32, 0);
        context.lineTo(-width * 0.32, 0);
        context.closePath();
        context.fill();
      } else {
        context.lineWidth = width;
        context.lineCap = handType === "thin" ? "butt" : "round";
        context.beginPath();
        context.moveTo(0, 0);
        context.lineTo(0, -length);
        context.stroke();
      }

      context.restore();
    }

    function drawExportLabel(context, centerX, centerY, clockDiameter) {
      const text = getLabelText();
      const geometry = getLabelGeometry(clockDiameter);

      context.save();
      context.font = getLabelFontCss(geometry.fontSize);
      context.textAlign = "center";
      context.textBaseline = "alphabetic";
      context.lineJoin = "round";
      context.strokeStyle = state.labelStrokeColor;
      context.lineWidth = geometry.strokeWidth;
      context.fillStyle = state.labelFillColor;

      const correctedWidths = Array.from(text, char => context.measureText(char).width);
      const totalAngle = correctedWidths.reduce((sum, width) => sum + width / geometry.radius, 0);
      let angle = geometry.centerAngle - (totalAngle / 2);

      Array.from(text).forEach((char, index) => {
        const charAngle = correctedWidths[index] / geometry.radius;
        angle += charAngle / 2;
        context.save();
        context.translate(
          centerX + Math.cos(angle) * geometry.radius,
          centerY + Math.sin(angle) * geometry.radius
        );
        context.rotate(angle + Math.PI / 2);
        if (!state.labelStrokeNone) {
          context.strokeText(char, 0, 0);
        }
        if (!state.labelFillNone) {
          context.fillText(char, 0, 0);
        }
        context.restore();
        angle += charAngle / 2;
      });

      context.restore();
    }

    function isGifImage() {
      return /^data:image\/gif/i.test(state.imageUrl || "") || state.imageMime === "image/gif";
    }

    function updateDownloadButtonText() {
      const labels = {
        png: "PNG 저장",
        webm: "WEBM 저장"
      };

      const format = getExportFormat();
      els.downloadLabel.textContent = labels[format] || labels.png;
      els.exportFormatList.querySelectorAll("[data-export-format]").forEach(button => {
        button.setAttribute("aria-checked", String(button.dataset.exportFormat === format));
      });
    }

    function getExportFormat() {
      if (state.exportFormat === "webm") return "webm";
      if (state.exportFormat !== "png") {
        state.exportFormat = "png";
      }
      return "png";
    }

    function updateDownloadBusyState() {
      els.download.disabled = isExporting;
      els.download.setAttribute("aria-busy", String(isExporting));
      els.exportFormatList.querySelectorAll("[data-export-format]").forEach(button => {
        button.disabled = isExporting;
      });
    }

    function toggleExportFormatMenu() {
      if (isExporting) {
        showStatus("저장 작업이 끝난 뒤 다시 시도하세요.", "error", 1800);
        return;
      }

      const willOpen = els.exportFormatList.hidden;
      els.exportFormatList.hidden = !willOpen;
      els.download.setAttribute("aria-expanded", String(willOpen));
    }

    function closeExportFormatMenu() {
      els.exportFormatList.hidden = true;
      els.download.setAttribute("aria-expanded", "false");
    }

    function getSupportedVideoMimeType() {
      const types = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];

      return types.find(type => MediaRecorder.isTypeSupported(type)) || "";
    }

    function dataUrlToBytes(dataUrl) {
      const commaIndex = dataUrl.indexOf(",");
      const header = dataUrl.slice(0, commaIndex);
      const payload = dataUrl.slice(commaIndex + 1);

      if (/;base64/i.test(header)) {
        const binary = atob(payload);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index++) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      return new TextEncoder().encode(decodeURIComponent(payload));
    }

    async function forEachGifFrame(callback) {
      const source = dataUrlToBytes(state.imageUrl);
      const gifInfo = parseGifFrameInfo(source);
      const decoder = new ImageDecoder({ data: source, type: "image/gif" });
      await decoder.tracks.ready;

      const decodedTrack = decoder.tracks.selectedTrack;
      const decoderFrameCount = Number.isFinite(decodedTrack?.frameCount) && decodedTrack.frameCount > 0
        ? decodedTrack.frameCount
        : 0;
      const knownFrameCount = gifInfo.frameCount || decoderFrameCount || 1;

      try {
        for (let index = 0; index < knownFrameCount; index++) {
          const result = await decoder.decode({ frameIndex: index });
          const isLast = index === knownFrameCount - 1;
          const durationUs = gifInfo.delays[index] || result.image.duration || 100000;

          try {
            await callback({
              image: result.image,
              index,
              frameCount: knownFrameCount,
              durationUs,
              isLast
            });
          } finally {
            result.image.close?.();
          }
        }
      } finally {
        await decoder.close?.();
      }
    }

    function parseGifFrameInfo(bytes) {
      const info = {
        frameCount: 0,
        delays: []
      };

      if (
        bytes.length < 13 ||
        bytes[0] !== 0x47 ||
        bytes[1] !== 0x49 ||
        bytes[2] !== 0x46
      ) {
        return info;
      }

      let offset = 10;
      const packed = bytes[offset];
      offset += 3;

      if (packed & 0x80) {
        offset += 3 * (1 << ((packed & 0x07) + 1));
      }

      let pendingDelayCs = 10;

      while (offset < bytes.length) {
        const block = bytes[offset++];

        if (block === 0x3b) break;

        if (block === 0x21) {
          const label = bytes[offset++];

          if (label === 0xf9 && bytes[offset] === 4) {
            offset++;
            offset++;
            pendingDelayCs = bytes[offset] | (bytes[offset + 1] << 8);
            offset += 2;
            offset += 2;
            continue;
          }

          offset = skipGifSubBlocks(bytes, offset);
          continue;
        }

        if (block === 0x2c) {
          if (offset + 9 > bytes.length) break;
          const imagePacked = bytes[offset + 8];
          offset += 9;

          if (imagePacked & 0x80) {
            offset += 3 * (1 << ((imagePacked & 0x07) + 1));
          }

          offset++;
          offset = skipGifSubBlocks(bytes, offset);
          info.frameCount++;
          info.delays.push(Math.max(2, pendingDelayCs || 10) * 10000);
          pendingDelayCs = 10;
          continue;
        }

        break;
      }

      return info;
    }

    function skipGifSubBlocks(bytes, offset) {
      while (offset < bytes.length) {
        const size = bytes[offset++];
        if (size === 0) break;
        offset += size;
      }

      return offset;
    }

    function getLabelText() {
      if (!state.includeTime) return state.labelText;
      return `${formatTime()} ${state.labelText}`;
    }

    function populateTimePicker() {
      els.pickerHour.innerHTML = Array.from(
        { length: 12 },
        (_, index) => {
          const hour = index + 1;
          return `<option value="${hour}">${String(hour).padStart(2, "0")}</option>`;
        }
      ).join("");

      els.pickerMinute.innerHTML = Array.from(
        { length: 60 },
        (_, minute) => `<option value="${minute}">${String(minute).padStart(2, "0")}</option>`
      ).join("");

      els.pickerHour.value = state.hour;
      els.pickerMinute.value = state.minute;
    }

    function formatTime() {
      return `${String(state.hour).padStart(2, "0")}:${String(state.minute).padStart(2, "0")}`;
    }

    function formatTimestamp(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      const second = String(date.getSeconds()).padStart(2, "0");
      return `${year}${month}${day}-${hour}${minute}${second}`;
    }

    function sanitizeFilenamePart(value, fallback = "clock") {
      const sanitized = String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]/g, "")
        .replace(/\s+/g, "_")
        .replace(/_+/g, "_")
        .slice(0, 60);

      return sanitized || fallback;
    }

    function getPngFilename() {
      const label = sanitizeFilenamePart(state.labelText || getLabelText());
      return `${label}_${formatTimestamp()}.png`;
    }

    function getWebmFilename() {
      const label = sanitizeFilenamePart(state.labelText || getLabelText());
      return `${label}_${formatTimestamp()}.webm`;
    }

    async function initialize() {
      await loadSettings();
      await loadSlotLabels();
      await loadSlotTabs();
      setActiveSlotBaseline();
      syncControlsFromState();
      updateImageControlRange();
      bindControls();
      render();
      updateHistoryButtons();
    }

    initialize();
  </script>
</body>

</html>
