<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock Image Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171717;
      color: #fff;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 330px 1fr;
      min-height: 100vh;
    }

    .panel {
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: #232323;
      border-right: 1px solid #444;
      overflow-y: auto;
    }

    .panel h1 {
      order: 0;
      margin: 0 0 14px;
      font-size: 20px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px;
      gap: 10px;
      align-items: center;
    }

    .field-row .field {
      margin-bottom: 10px;
    }

    .field-row .field input {
      height: 32px;
    }

    .field-row input[type="range"] {
      padding: 0;
    }

    .field-row input[type="color"] {
      padding: 4px;
    }

    .section {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #444;
    }

    .section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .section h2 {
      margin: 0 0 10px;
      color: #f1d6a8;
      font-size: 15px;
    }

    .section-save {
      order: 1;
      margin-bottom: 12px;
    }

    .section-image {
      order: 2;
    }

    .section-clock {
      order: 3;
    }

    details.section summary {
      margin: 0 0 10px;
      color: #f1d6a8;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    details.section:not([open]) summary {
      margin-bottom: 0;
    }

    .range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px;
      gap: 7px;
      align-items: center;
    }

    .range-value {
      color: #ddd;
      font-size: 12px;
      text-align: right;
    }

    .compact-group {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      padding: 9px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #1d1d1d;
    }

    .compact-group .field {
      margin-bottom: 0;
    }

    .label-toolbar {
      display: grid;
      grid-template-columns: 60px repeat(6, 30px);
      gap: 6px;
      align-items: end;
      margin-bottom: 10px;
    }

    .label-toolbar label {
      display: block;
      min-width: 0;
    }

    .label-toolbar span {
      display: block;
      margin-bottom: 4px;
      overflow: hidden;
      color: #aaa;
      font-size: 10px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label-toolbar select,
    .label-toolbar input[type="color"],
    .format-toggle {
      width: 100%;
      height: 30px;
      padding: 3px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #111;
      color: #fff;
    }

    .format-toggle {
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: 700;
    }

    .format-toggle.is-active {
      border-color: #f1d6a8;
      background: #f1d6a8;
      color: #352517;
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: -2px 0 10px;
      color: #ccc;
      font-size: 12px;
    }

    .check-field input {
      width: auto;
      accent-color: #f1d6a8;
    }

    .time-picker {
      display: grid;
      grid-template-columns: 2fr 2fr 1fr;
      gap: 8px;
      align-items: end;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .time-picker span {
      display: block;
      margin-bottom: 4px;
      color: #aaa;
      font-size: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #ccc;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: white;
    }

    .hint {
      order: 0;
      margin: -3px 0 13px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: #f1d6a8;
      color: #352517;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
    }

    .button:hover {
      background: #ffe4b7;
    }

    .button-secondary {
      border: 1px solid #666;
      background: transparent;
      color: #ddd;
    }

    .button-secondary:hover {
      background: #333;
    }

    .save-tools {
      display: grid;
      grid-template-columns: 34px 34px minmax(0, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .save-tools .button {
      height: 34px;
      margin-top: 0;
      padding: 6px;
      font-size: 13px;
    }

    .save-tools .icon-button {
      line-height: 1;
    }

    .save-tools .icon-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .preview {
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .canvas {
      position: relative;
      width: min(80vw, 900px);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #333;
    }

    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      left: 50%;
      top: 50%;

      max-width: none;
      max-height: none;

      width: 100%;
      height: 100%;
      object-fit: cover;

      transform: translate(-50%, -50%) translate(var(--image-x), var(--image-y)) scale(var(--image-scale));
      transform-origin: center center;
    }

    .outside-mask {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .clock {
      position: absolute;
      left: 50%;
      top: 54%;
      width: var(--clock-size);
      height: var(--clock-size);
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .face {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ring-size);
      height: var(--ring-size);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    .tick {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 50% 100%;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3.5%;
      height: 3.5%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .label-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }

    .label-svg text {
      paint-order: stroke;
      stroke-linejoin: round;
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="panel">
      <h1>시계 설정</h1>
      <p class="hint">배경 그림을 넣고 시계 모양과 시간을 조절한 뒤 PNG로 저장하세요.</p>

      <section class="section section-save">
        <h2>저장</h2>

        <div class="field">
          <label>이미지 크기</label>
          <select id="exportSize">
            <option value="1024">1024 x 1024</option>
            <option value="1536" selected>1536 x 1536</option>
            <option value="2048">2048 x 2048</option>
          </select>
        </div>

        <button id="download" class="button" type="button">PNG 이미지 저장</button>
        <div class="save-tools">
          <button id="exportSettings" class="button button-secondary icon-button" type="button" title="설정 JSON 저장"
            aria-label="설정 JSON 저장">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h12l2 2v14H5z" />
              <path d="M8 4v6h8V4M8 20v-6h8v6" />
            </svg>
          </button>
          <button id="importSettings" class="button button-secondary icon-button" type="button" title="설정 JSON 불러오기"
            aria-label="설정 JSON 불러오기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 19V6h7l2 3h9v10z" />
              <path d="m9 14 3-3 3 3M12 11v6" />
            </svg>
          </button>
          <button id="newProject" class="button button-secondary" type="button">새로 만들기</button>
        </div>
        <input id="importSettingsFile" type="file" accept="application/json,.json" hidden />
      </section>

      <details class="section section-image" open>
        <summary>이미지</summary>

        <div class="field">
          <label>이미지 파일</label>
          <input id="file" type="file" accept="image/*" />
        </div>

        <div class="compact-group">
          <div class="field">
            <label>이미지 확대</label>
            <div class="range-row">
              <input id="imageScale" type="range" min="30" max="500" value="100" />
              <output id="imageScaleValue" class="range-value">100%</output>
            </div>
          </div>

          <div class="field">
            <label>이미지 X 위치</label>
            <div class="range-row">
              <input id="imageX" type="range" min="-100" max="100" value="0" />
              <output id="imageXValue" class="range-value">0px</output>
            </div>
          </div>

          <div class="field">
            <label>이미지 Y 위치</label>
            <div class="range-row">
              <input id="imageY" type="range" min="-100" max="100" value="0" />
              <output id="imageYValue" class="range-value">0px</output>
            </div>
          </div>
        </div>
      </details>

      <details class="section section-clock" open>
        <summary>시계</summary>

        <div class="time-picker field">
          <label>
            <span>시</span>
            <select id="pickerHour"></select>
          </label>
          <label>
            <span>분</span>
            <select id="pickerMinute"></select>
          </label>
          <label>
            <span>시간표시</span>
            <button id="includeTime" class="format-toggle" type="button" aria-pressed="false"><i>T</i></button>
          </label>

        </div>

        <div class="field">
          <label>텍스트</label>
          <input id="labelText" type="text" value="설홍시" />
        </div>

        <div class="field">
          <label>폰트</label>
          <select id="fontPreset">
            <option value="pretendard">Pretendard</option>
            <option value="notoSans">Noto Sans KR</option>
            <option value="notoSerif">Noto Serif KR</option>
            <option value="blackHanSans">Black Han Sans</option>
            <option value="nanumGothic">Nanum Gothic</option>
            <option value="nanumPenScript">Nanum Pen Script</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div id="customFontField" class="field" hidden>
          <label>Custom 폰트</label>
          <input id="labelFont" type="text" value="Pretendard, 'Noto Sans KR', sans-serif" />
        </div>

        <div class="label-toolbar">
          <label>
            <span>크기</span>
            <select id="labelFontSize">
              <option value="60">60%</option>
              <option value="80">80%</option>
              <option value="100" selected>100%</option>
              <option value="120">120%</option>
              <option value="140">140%</option>
              <option value="160">160%</option>
            </select>
          </label>
          <label>
            <span>Bold</span>
            <button id="labelBold" class="format-toggle is-active" type="button" aria-pressed="true">B</button>
          </label>
          <label>
            <span>Italic</span>
            <button id="labelItalic" class="format-toggle" type="button" aria-pressed="false"><i>I</i></button>
          </label>
          <label>
            <span>내부색</span>
            <input id="labelFillColor" type="color" value="#ffffff" />
          </label>
          <label>
            <span>없음</span>
            <button id="labelFillNone" class="format-toggle" type="button" aria-pressed="false">F̸</button>
          </label>
          <label>
            <span>테두리</span>
            <input id="labelStrokeColor" type="color" value="#000000" />
          </label>
          <label>
            <span>없음</span>
            <button id="labelStrokeNone" class="format-toggle" type="button" aria-pressed="false">S̸</button>
          </label>
        </div>

        <div class="compact-group">
          <div class="field">
            <label>레이블 간격</label>
            <div class="range-row">
              <input id="labelGap" type="range" min="-3" max="3" step="0.5" value="0" />
              <output id="labelGapValue" class="range-value">0</output>
            </div>
          </div>
          <div class="field">
            <label>레이블 좌우</label>
            <div class="range-row">
              <input id="labelOffset" type="range" min="-15" max="15" step="1" value="0" />
              <output id="labelOffsetValue" class="range-value">0</output>
            </div>
          </div>
        </div>

        <div class="field">
          <label>테마</label>
          <select id="theme">
            <option value="classic">Classic Ring</option>
            <option value="double">Double Ring</option>
            <option value="minimal">Minimal</option>
            <option value="dot">Dot Marker</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label>배경 투명도</label>
            <input id="outsideOpacity" type="range" min="0" max="1" step="0.01" value="0.30" />
          </div>

          <div class="field">
            <label>배경색</label>
            <input id="outsideColor" type="color" value="#000000" />
          </div>
        </div>

      </details>

    </aside>

    <main class="preview">
      <div id="canvas" class="canvas">
        <div id="bg" class="bg">
          <img id="bgImg" class="bg-img" alt="">
        </div>
        <div id="outsideMask" class="outside-mask"></div>
        <div id="clock" class="clock"></div>
      </div>
    </main>

  </div>

  <script>
    const RING_SIZE = 88;
    const DEFAULT_CLOCK_SIZE = 96;
    const CLOCK_CENTER_Y = 54;
    const DB_NAME = "clock-image-maker";
    const DB_STORE = "settings";
    const DB_KEY = "current";
    function createDefaultState() {
      const now = new Date();

      return {
        imageUrl: "",
        imageX: 0,
        imageY: 0,
        imageScale: 100,

        labelText: "",
        labelFont: "Pretendard, 'Noto Sans KR', sans-serif",
        fontPreset: "pretendard",
        labelBold: true,
        labelItalic: false,
        labelFontSize: 100,
        labelFillColor: "#ffffff",
        labelFillNone: false,
        labelStrokeColor: "#000000",
        labelStrokeNone: false,
        labelGap: 0,
        labelOffset: 0,

        hour: (now.getHours() % 12) || 12,
        minute: now.getMinutes(),
        includeTime: true,

        theme: "classic",

        outsideColor: "#000000",
        outsideOpacity: 0.30
      };
    }

    const state = createDefaultState();

    const themes = {
      classic: {
        color: "#fff8ec",
        ringBorder: "10px solid #fff8ec",
        tickType: "bar",
        handType: "round",
        centerDot: false
      },
      double: {
        color: "#fff8ec",
        ringBorder: "8px double #fff8ec",
        tickType: "bar",
        handType: "diamond",
        centerDot: false
      },
      minimal: {
        color: "#ffffff",
        ringBorder: "4px solid #ffffff",
        tickType: "none",
        handType: "thin",
        centerDot: false
      },
      dot: {
        color: "#ffffff",
        ringBorder: "8px solid #ffffff",
        tickType: "dot",
        handType: "taper",
        centerDot: true
      }
    };

    const $ = id => document.getElementById(id);

    const els = {
      file: $("file"),
      imageX: $("imageX"),
      imageY: $("imageY"),
      imageScale: $("imageScale"),
      imageXValue: $("imageXValue"),
      imageYValue: $("imageYValue"),
      imageScaleValue: $("imageScaleValue"),
      labelText: $("labelText"),
      labelFont: $("labelFont"),
      fontPreset: $("fontPreset"),
      customFontField: $("customFontField"),
      labelBold: $("labelBold"),
      labelItalic: $("labelItalic"),
      labelFontSize: $("labelFontSize"),
      labelFillColor: $("labelFillColor"),
      labelFillNone: $("labelFillNone"),
      labelStrokeColor: $("labelStrokeColor"),
      labelStrokeNone: $("labelStrokeNone"),
      labelGap: $("labelGap"),
      labelGapValue: $("labelGapValue"),
      labelOffset: $("labelOffset"),
      labelOffsetValue: $("labelOffsetValue"),
      pickerHour: $("pickerHour"),
      pickerMinute: $("pickerMinute"),
      includeTime: $("includeTime"),
      theme: $("theme"),
      outsideColor: $("outsideColor"),
      outsideOpacity: $("outsideOpacity"),
      exportSize: $("exportSize"),
      download: $("download"),
      exportSettings: $("exportSettings"),
      importSettings: $("importSettings"),
      importSettingsFile: $("importSettingsFile"),
      newProject: $("newProject"),

      canvas: $("canvas"),
      bg: $("bg"),
      bgImg: $("bgImg"),
      outsideMask: $("outsideMask"),
      clock: $("clock")
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, Number(value)));
    }

    function openSettingsDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.addEventListener("upgradeneeded", () => {
          request.result.createObjectStore(DB_STORE);
        });

        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
    }

    async function loadSettings() {
      try {
        const db = await openSettingsDb();
        const cached = await new Promise((resolve, reject) => {
          const request = db.transaction(DB_STORE).objectStore(DB_STORE).get(DB_KEY);
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();

        if (cached) {
          Object.assign(state, cached);
          if (!Object.prototype.hasOwnProperty.call(cached, "fontPreset")) {
            state.fontPreset = "custom";
          }
          if (cached.labelStrokeColor === "#5a321f") {
            state.labelStrokeColor = "#000000";
          }
        }
        state.labelGap = clamp(state.labelGap, -3, 3);
      } catch (error) {
        console.warn("설정 캐시를 불러오지 못했습니다.", error);
      }
    }

    async function saveSettings() {
      try {
        const db = await openSettingsDb();
        await new Promise((resolve, reject) => {
          const request = db
            .transaction(DB_STORE, "readwrite")
            .objectStore(DB_STORE)
            .put({ ...state }, DB_KEY);

          request.addEventListener("success", () => resolve());
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();
      } catch (error) {
        console.warn("설정 캐시를 저장하지 못했습니다.", error);
      }
    }

    async function clearSettings() {
      try {
        const db = await openSettingsDb();
        await new Promise((resolve, reject) => {
          const request = db
            .transaction(DB_STORE, "readwrite")
            .objectStore(DB_STORE)
            .delete(DB_KEY);

          request.addEventListener("success", () => resolve());
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();
      } catch (error) {
        console.warn("설정 캐시를 지우지 못했습니다.", error);
      }
    }

    async function createNewProject() {
      const shouldReset = window.confirm(
        "새로 만들기를 실행하면 저장된 이미지와 설정 캐시가 삭제됩니다. 계속할까요?"
      );
      if (!shouldReset) return;

      await clearSettings();
      Object.assign(state, createDefaultState());
      els.file.value = "";
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
    }

    function exportSettingsJson() {
      const payload = {
        app: "clock-image-maker",
        version: 1,
        exportedAt: new Date().toISOString(),
        settings: { ...state }
      };

      const url = URL.createObjectURL(
        new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" })
      );
      const link = document.createElement("a");
      link.download = `clock-image-maker-${formatTime().replace(":", "-")}.json`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importSettingsJson(file) {
      const reader = new FileReader();

      reader.addEventListener("load", async () => {
        try {
          const payload = JSON.parse(reader.result);

          if (
            payload?.app !== "clock-image-maker" ||
            payload?.version !== 1 ||
            !payload.settings ||
            typeof payload.settings !== "object"
          ) {
            throw new Error("지원하지 않는 설정 파일입니다.");
          }

          Object.assign(state, createDefaultState(), payload.settings);
          syncControlsFromState();
          populateTimePicker();
          updateImageControlRange();
          render();
          await saveSettings();
        } catch (error) {
          window.alert(error.message || "설정 JSON을 불러오지 못했습니다.");
        } finally {
          els.importSettingsFile.value = "";
        }
      });

      reader.addEventListener("error", () => {
        window.alert("설정 JSON 파일을 읽지 못했습니다.");
        els.importSettingsFile.value = "";
      });

      reader.readAsText(file, "utf-8");
    }

    function syncControlsFromState() {
      [
        "imageX",
        "imageY",
        "imageScale",
        "labelText",
        "labelFont",
        "fontPreset",
        "labelFontSize",
        "labelFillColor",
        "labelStrokeColor",
        "labelGap",
        "labelOffset",
        "theme",
        "outsideColor",
        "outsideOpacity"
      ].forEach(key => {
        els[key].value = state[key];
      });

      updateFormatToggle(els.includeTime, includeTime);
      updateFormatToggle(els.labelBold, state.labelBold);
      updateFormatToggle(els.labelItalic, state.labelItalic);
      updateFormatToggle(els.labelFillNone, state.labelFillNone);
      updateFormatToggle(els.labelStrokeNone, state.labelStrokeNone);
      updateCustomFontVisibility();
    }

    function getLabelFontFamily() {
      const presets = {
        pretendard: "Pretendard, 'Noto Sans KR', sans-serif",
        notoSans: "'Noto Sans KR', sans-serif",
        notoSerif: "'Noto Serif KR', serif",
        blackHanSans: "'Black Han Sans', sans-serif",
        nanumGothic: "'Nanum Gothic', sans-serif",
        nanumPenScript: "'Nanum Pen Script', cursive",
        serif: "Georgia, 'Times New Roman', serif",
        monospace: "Consolas, monospace"
      };

      return state.fontPreset === "custom"
        ? state.labelFont
        : presets[state.fontPreset] || presets.pretendard;
    }

    function getLabelFontWeight() {
      return state.labelBold ? 900 : 400;
    }

    function updateCustomFontVisibility() {
      els.customFontField.hidden = state.fontPreset !== "custom";
    }

    function updateFormatToggle(button, isActive) {
      button.classList.toggle("is-active", isActive);
      button.setAttribute("aria-pressed", String(isActive));
    }

    function render() {
      const theme = themes[state.theme];

      const ringSize = RING_SIZE;
      els.clock.innerHTML = "";
      updateRangeValues();

      els.clock.style.setProperty("--clock-size", `${DEFAULT_CLOCK_SIZE}%`);
      els.clock.style.setProperty("--ring-size", `${ringSize}%`);
      els.bg.style.backgroundImage = state.imageUrl
        ? "none"
        : "linear-gradient(135deg, #642020, #2d2d2d)";

      els.bgImg.src = state.imageUrl;
      els.bgImg.style.display = state.imageUrl ? "block" : "none";
      els.bg.style.setProperty("--image-x", `${state.imageX}px`);
      els.bg.style.setProperty("--image-y", `${state.imageY}px`);
      els.bg.style.setProperty("--image-scale", state.imageScale / 100);

      updateOutsideMask(DEFAULT_CLOCK_SIZE, ringSize);

      const face = document.createElement("div");
      face.className = "face";
      face.style.border = theme.ringBorder;
      els.clock.appendChild(face);

      createCurvedLabel(els.clock);
      createTicks(face, theme);
      createHands(face, theme);

      if (theme.centerDot) {
        createCenterDot(face, theme.color);
      }
    }

    function updateRangeValues() {
      els.imageScaleValue.textContent = `${state.imageScale}%`;
      els.imageXValue.textContent = `${state.imageX}px`;
      els.imageYValue.textContent = `${state.imageY}px`;
      els.labelGapValue.textContent = `${state.labelGap}`;
      els.labelOffsetValue.textContent = `${state.labelOffset}`;
    }

    function updateImageControlRange() {
      const canvasSize = document.querySelector(".canvas").getBoundingClientRect().width;
      const renderedSize = canvasSize * (state.imageScale / 100);
      const limit = Math.round(renderedSize / 3);

      els.imageX.min = -limit;
      els.imageX.max = limit;

      els.imageY.min = -limit;
      els.imageY.max = limit;

      state.imageX = Math.max(-limit, Math.min(limit, state.imageX));
      state.imageY = Math.max(-limit, Math.min(limit, state.imageY));

      els.imageX.value = state.imageX;
      els.imageY.value = state.imageY;
    }

    function updateOutsideMask(clockSize, ringSize) {
      const canvasSize = document.querySelector(".canvas").getBoundingClientRect().width;
      const radius = canvasSize * (clockSize / 100) * (ringSize / 100) / 2;
      const centerX = canvasSize / 2;
      const centerY = canvasSize * (CLOCK_CENTER_Y / 100);

      els.outsideMask.style.background = state.outsideColor;
      els.outsideMask.style.opacity = state.outsideOpacity;

      els.outsideMask.style.mask = `
        radial-gradient(
          circle ${radius}px at ${centerX}px ${centerY}px,
          transparent 0 ${radius}px,
          black ${radius + 1}px
        )
      `;

      els.outsideMask.style.webkitMask = els.outsideMask.style.mask;
    }

    function createCurvedLabel(parent) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const labelRadius = 45 + Number(state.labelGap);
      const labelStartOffset = 50 + Number(state.labelOffset);

      svg.classList.add("label-svg");
      svg.setAttribute("viewBox", "0 0 100 100");

      svg.innerHTML = `
    <defs>
      <path id="labelPath" d="M ${50 - labelRadius} 50 A ${labelRadius} ${labelRadius} 0 0 1 ${50 + labelRadius} 50" />
    </defs>

    <text
      font-family="${escapeAttr(getLabelFontFamily())}"
      font-weight="${getLabelFontWeight()}"
      font-style="${state.labelItalic ? "italic" : "normal"}"
      font-size="${6.2 * (state.labelFontSize / 100)}"
      fill="${escapeAttr(state.labelFillNone ? "transparent" : state.labelFillColor)}"
      stroke="${escapeAttr(state.labelStrokeNone ? "transparent" : state.labelStrokeColor)}"
      stroke-width="${state.labelFillNone ? "0.62" : "1.25"}">
      <textPath
        href="#labelPath"
        startOffset="${labelStartOffset}%"
        text-anchor="middle">
        ${escapeHTML(getLabelText())}
      </textPath>
    </text>
  `;

      parent.appendChild(svg);
    }

    function createTicks(parent, theme) {
      if (theme.tickType === "none") return;

      const radius = 43;

      for (let i = 0; i < 12; i++) {
        const angle = i * 30;
        const rad = angle * Math.PI / 180;

        const tick = document.createElement("div");
        tick.className = "tick";

        tick.style.left = `${50 + Math.sin(rad) * radius}%`;
        tick.style.top = `${50 - Math.cos(rad) * radius}%`;
        tick.style.background = theme.color;

        if (theme.tickType === "bar") {
          tick.style.width = "1.5%";
          tick.style.height = "7%";
          tick.style.borderRadius = "999px";
          tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        if (theme.tickType === "dot") {
          tick.style.width = "2.8%";
          tick.style.height = "2.8%";
          tick.style.borderRadius = "50%";
          tick.style.transform = "translate(-50%, -50%)";
        }

        parent.appendChild(tick);
      }
    }

    function createHands(parent, theme) {
      const hourAngle = ((state.hour % 12) * 30) + (state.minute * 0.5);
      const minuteAngle = state.minute * 6;

      createHand(parent, "hour", hourAngle, 27, theme);
      createHand(parent, "minute", minuteAngle, 36, theme);
    }

    function createHand(parent, name, angle, length, theme) {
      const hand = document.createElement("div");
      hand.className = `hand ${name}`;
      hand.style.height = `${length}%`;
      hand.style.background = theme.color;
      hand.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;

      if (theme.handType === "round") {
        hand.style.width = name === "hour" ? "2.5%" : "1.5%";
        hand.style.borderRadius = "999px";
      }

      if (theme.handType === "diamond") {
        hand.style.width = name === "hour" ? "3.2%" : "2.1%";
        hand.style.clipPath = "polygon(50% 0%, 100% 88%, 50% 100%, 0% 88%)";
      }

      if (theme.handType === "thin") {
        hand.style.width = name === "hour" ? "1.1%" : "0.75%";
        hand.style.borderRadius = "999px";
      }

      if (theme.handType === "taper") {
        hand.style.width = name === "hour" ? "2.8%" : "1.8%";
        hand.style.clipPath = "polygon(50% 0%, 82% 100%, 18% 100%)";
      }

      parent.appendChild(hand);
    }

    function createCenterDot(parent, color) {
      const dot = document.createElement("div");
      dot.className = "center-dot";
      dot.style.background = color;
      parent.appendChild(dot);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHTML(value).replace(/`/g, "&#096;");
    }

    function bindControls() {
      els.file.addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.addEventListener("load", () => {
          state.imageUrl = reader.result;
          render();
          saveSettings();
        });
        reader.readAsDataURL(file);
      });

      populateTimePicker();

      [els.pickerHour, els.pickerMinute].forEach(select => {
        select.addEventListener("input", () => {
          state.hour = Number(els.pickerHour.value);
          state.minute = Number(els.pickerMinute.value);
          render();
          saveSettings();
        });
      });

      els.fontPreset.addEventListener("input", event => {
        state.fontPreset = event.target.value;
        updateCustomFontVisibility();
        render();
        saveSettings();
      });

      [
        [els.includeTime, "includeTime"],
        [els.labelBold, "labelBold"],
        [els.labelItalic, "labelItalic"],
        [els.labelFillNone, "labelFillNone"],
        [els.labelStrokeNone, "labelStrokeNone"]
      ].forEach(([button, key]) => {
        button.addEventListener("click", () => {
          state[key] = !state[key];
          updateFormatToggle(button, state[key]);
          render();
          saveSettings();
        });
      });

      const bindings = [
        ["imageX", "number"],
        ["imageY", "number"],
        ["imageScale", "number"],
        ["labelText", "text"],
        ["labelFont", "text"],
        ["labelFontSize", "number"],
        ["labelFillColor", "text"],
        ["labelStrokeColor", "text"],
        ["labelGap", "number"],
        ["labelOffset", "number"],
        ["theme", "text"],
        ["outsideColor", "text"],
        ["outsideOpacity", "number"]
      ];

      bindings.forEach(([key, type]) => {
        els[key].addEventListener("input", event => {
          state[key] = type === "number"
            ? Number(event.target.value)
            : event.target.value;

          render();

          // 확대가 바뀌면 이동범위 재계산
          if (key === "imageScale") {
            updateImageControlRange();
            render();
          }

          saveSettings();
        });
      });

      els.download.addEventListener("click", downloadPng);
      els.exportSettings.addEventListener("click", exportSettingsJson);
      els.importSettings.addEventListener("click", () => els.importSettingsFile.click());
      els.importSettingsFile.addEventListener("change", event => {
        const file = event.target.files[0];
        if (file) importSettingsJson(file);
      });
      els.newProject.addEventListener("click", createNewProject);
    }

    async function downloadPng() {
      if (document.fonts?.ready) {
        await document.fonts.ready;
      }

      const size = Number(els.exportSize.value);
      const output = document.createElement("canvas");
      output.width = size;
      output.height = size;

      const context = output.getContext("2d");
      const theme = themes[state.theme];
      const screenSize = $("canvas").getBoundingClientRect().width || size;
      const scale = size / screenSize;
      const centerX = size / 2;
      const centerY = size * (CLOCK_CENTER_Y / 100);
      const clockDiameter = size * (DEFAULT_CLOCK_SIZE / 100);
      const ringRadius = clockDiameter * (RING_SIZE / 100) / 2;

      drawExportBackground(context, size, scale);
      drawExportOutsideMask(context, size, centerX, centerY, ringRadius);
      drawExportRing(context, theme, centerX, centerY, ringRadius, size);
      drawExportTicks(context, theme, centerX, centerY, ringRadius, size);
      drawExportHands(context, theme, centerX, centerY, ringRadius, size);
      drawExportLabel(context, centerX, centerY, clockDiameter, size);

      const blob = await new Promise(resolve => output.toBlob(resolve, "image/png"));
      if (!blob) {
        window.alert("PNG 이미지를 만들지 못했습니다.");
        return;
      }

      await savePngBlob(blob);
    }

    async function savePngBlob(blob) {
      const filename = getPngFilename();

      if ("showSaveFilePicker" in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: "PNG 이미지",
              accept: { "image/png": [".png"] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
          console.warn("파일 저장 선택기를 사용할 수 없어 다운로드 방식으로 전환합니다.", error);
        }
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = filename;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    }

    function drawExportBackground(context, size, scale) {
      if (!state.imageUrl || !els.bgImg.complete || !els.bgImg.naturalWidth) {
        const gradient = context.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, "#642020");
        gradient.addColorStop(1, "#2d2d2d");
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        return;
      }

      const image = els.bgImg;
      const coverScale = Math.max(size / image.naturalWidth, size / image.naturalHeight);
      const imageScale = coverScale * (state.imageScale / 100);
      const width = image.naturalWidth * imageScale;
      const height = image.naturalHeight * imageScale;
      const x = ((size - width) / 2) + (state.imageX * scale);
      const y = ((size - height) / 2) + (state.imageY * scale);

      context.drawImage(image, x, y, width, height);
    }

    function drawExportOutsideMask(context, size, centerX, centerY, radius) {
      context.save();
      context.fillStyle = state.outsideColor;
      context.globalAlpha = state.outsideOpacity;
      context.beginPath();
      context.rect(0, 0, size, size);
      context.arc(centerX, centerY, radius, 0, Math.PI * 2);
      context.fill("evenodd");
      context.restore();
    }

    function drawExportRing(context, theme, centerX, centerY, radius, size) {
      context.save();
      context.strokeStyle = theme.color;
      context.lineWidth = size * (theme.ringBorder.startsWith("4px") ? 0.004 : 0.009);
      context.beginPath();
      context.arc(centerX, centerY, radius, 0, Math.PI * 2);
      context.stroke();

      if (theme.ringBorder.includes("double")) {
        context.lineWidth = size * 0.003;
        context.beginPath();
        context.arc(centerX, centerY, radius - (size * 0.009), 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();
    }

    function drawExportTicks(context, theme, centerX, centerY, radius, size) {
      if (theme.tickType === "none") return;

      context.save();
      context.strokeStyle = theme.color;
      context.fillStyle = theme.color;
      context.lineCap = "round";

      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const outerRadius = radius * 0.92;

        if (theme.tickType === "dot") {
          context.beginPath();
          context.arc(
            centerX + Math.cos(angle) * outerRadius,
            centerY + Math.sin(angle) * outerRadius,
            size * 0.011,
            0,
            Math.PI * 2
          );
          context.fill();
          continue;
        }

        context.lineWidth = size * 0.012;
        context.beginPath();
        context.moveTo(
          centerX + Math.cos(angle) * outerRadius,
          centerY + Math.sin(angle) * outerRadius
        );
        context.lineTo(
          centerX + Math.cos(angle) * (outerRadius - radius * 0.10),
          centerY + Math.sin(angle) * (outerRadius - radius * 0.10)
        );
        context.stroke();
      }
      context.restore();
    }

    function drawExportHands(context, theme, centerX, centerY, radius, size) {
      const hourAngle = (((state.hour % 12) * 30) + (state.minute * 0.5) - 90) * Math.PI / 180;
      const minuteAngle = ((state.minute * 6) - 90) * Math.PI / 180;

      drawExportHand(context, theme, centerX, centerY, radius * 0.54, hourAngle, size * 0.018);
      drawExportHand(context, theme, centerX, centerY, radius * 0.72, minuteAngle, size * 0.012);

      context.save();
      context.fillStyle = theme.color;
      context.beginPath();
      context.arc(centerX, centerY, size * 0.015, 0, Math.PI * 2);
      context.fill();
      context.restore();
    }

    function drawExportHand(context, theme, centerX, centerY, length, angle, width) {
      context.save();
      context.strokeStyle = theme.color;
      context.lineWidth = width;
      context.lineCap = theme.handType === "thin" ? "butt" : "round";
      context.beginPath();
      context.moveTo(centerX, centerY);
      context.lineTo(centerX + Math.cos(angle) * length, centerY + Math.sin(angle) * length);
      context.stroke();
      context.restore();
    }

    function drawExportLabel(context, centerX, centerY, clockDiameter, size) {
      const text = getLabelText();
      const fontSize = clockDiameter * 0.062 * (state.labelFontSize / 100);
      const radius = clockDiameter * ((45 + Number(state.labelGap)) / 100);
      const centerAngle = -Math.PI / 2 + (Number(state.labelOffset) * Math.PI / 180);

      context.save();
      context.font =
        `${state.labelItalic ? "italic " : ""}${getLabelFontWeight()} ${fontSize}px ${getLabelFontFamily()}`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.lineJoin = "round";
      context.strokeStyle = state.labelStrokeColor;
      context.lineWidth = size * (state.labelFillNone ? 0.005 : 0.010);
      context.fillStyle = state.labelFillColor;

      const correctedWidths = Array.from(text, char => context.measureText(char).width);
      const totalAngle = correctedWidths.reduce((sum, width) => sum + width / radius, 0);
      let angle = centerAngle - (totalAngle / 2);

      Array.from(text).forEach((char, index) => {
        const charAngle = correctedWidths[index] / radius;
        angle += charAngle / 2;
        context.save();
        context.translate(
          centerX + Math.cos(angle) * radius,
          centerY + Math.sin(angle) * radius
        );
        context.rotate(angle + Math.PI / 2);
        if (!state.labelStrokeNone) {
          context.strokeText(char, 0, 0);
        }
        if (!state.labelFillNone) {
          context.fillText(char, 0, 0);
        }
        context.restore();
        angle += charAngle / 2;
      });

      context.restore();
    }

    function getLabelText() {
      if (!state.includeTime) return state.labelText;
      return `${formatTime()} ${state.labelText}`;
    }

    function populateTimePicker() {
      els.pickerHour.innerHTML = Array.from(
        { length: 12 },
        (_, index) => {
          const hour = index + 1;
          return `<option value="${hour}">${String(hour).padStart(2, "0")}</option>`;
        }
      ).join("");

      els.pickerMinute.innerHTML = Array.from(
        { length: 60 },
        (_, minute) => `<option value="${minute}">${String(minute).padStart(2, "0")}</option>`
      ).join("");

      els.pickerHour.value = state.hour;
      els.pickerMinute.value = state.minute;
    }

    function formatTime() {
      return `${String(state.hour).padStart(2, "0")}:${String(state.minute).padStart(2, "0")}`;
    }

    function getPngFilename() {
      return `clock-${formatTime().replace(":", "-")}.png`;
    }

    async function initialize() {
      await loadSettings();
      syncControlsFromState();
      updateImageControlRange();
      bindControls();
      render();
    }

    initialize();
  </script>
</body>

</html>
