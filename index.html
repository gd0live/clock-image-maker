<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock Image Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171717;
      color: #fff;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 330px 1fr;
      min-height: 100vh;
    }

    .panel {
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: #232323;
      border-right: 1px solid #444;
      overflow-y: auto;
    }

    .panel h1 {
      order: 0;
      margin: 0 0 14px;
      font-size: 20px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .section {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #444;
    }

    .section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .section h2 {
      margin: 0 0 10px;
      color: #f1d6a8;
      font-size: 15px;
    }

    .section-save {
      order: 1;
      margin-bottom: 12px;
    }

    .section-image {
      order: 2;
    }

    .section-clock {
      order: 3;
    }

    .section-text {
      order: 4;
    }

    details.section summary {
      margin: 0 0 10px;
      color: #f1d6a8;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    details.section:not([open]) summary {
      margin-bottom: 0;
    }

    .field {
      margin-bottom: 10px;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: start;
      margin-bottom: 10px;
    }

    .field-row .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 0;
    }

    .field-row .field label {
      font-size: 12px;
      color: #ccc;
      margin: 0;
    }

    .field-row .field input[type="range"] {
      margin: 5px 0;
    }

    .field-row .field input[type="color"] {
      width: 100%;
    }

    .background-row .field {
      display: grid;
      grid-template-rows: 16px 32px;
      gap: 4px;
    }

    .background-row .field input[type="range"] {
      align-self: center;
      margin: 0;
    }

    .background-row .field input[type="color"] {
      align-self: center;
      height: 32px;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      height: 4px;
      width: 100%;
      padding: 0;
    }

    input[type="color"] {
      appearance: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 4px;
      background: #111;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 2px;
    }

    .field input:not([type="range"]) {
      width: 100%;
    }

    .range-row input[type="range"] {
      width: 100%;
    }

    .range-value {
      color: #ddd;
      font-size: 12px;
      text-align: right;
    }

    .compact-group {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      padding: 9px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #1d1d1d;
    }

    .compact-group .field {
      margin-bottom: 0;
    }

    .label-toolbar {
      display: grid;
      grid-template-columns: 60px repeat(6, 32px);
      gap: 6px;
      align-items: end;
      margin-bottom: 10px;
    }

    .label-toolbar label {
      display: block;
      min-width: 0;
    }

    .label-toolbar span {
      display: block;
      margin-bottom: 4px;
      overflow: hidden;
      color: #ccc;
      font-size: 11px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label-toolbar select,
    .label-toolbar input[type="color"],
    .format-toggle {
      display: block;
      width: 100%;
      height: 32px;
      padding: 0;
      border: 1px solid #555;
      border-radius: 5px;
      background: #111;
      color: #fff;
    }

    .format-toggle {
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: 700;
    }

    .format-toggle.is-active {
      border-color: #f1d6a8;
      background: #f1d6a8;
      color: #352517;
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: -2px 0 10px;
      color: #ccc;
      font-size: 12px;
    }

    .check-field input {
      width: auto;
      accent-color: #f1d6a8;
    }

    .time-picker {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: end;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .time-picker span {
      display: block;
      margin-bottom: 4px;
      color: #ccc;
      font-size: 12px;
    }

    .time-picker select {
      width: 100%;
      height: 32px;
      padding: 6px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: white;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #ccc;
    }

    .field input:not([type="range"]),
    .field select {
      width: 100%;
      height: 32px;
      padding: 6px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: white;
    }

    .field input[type="file"] {
      height: 40px;
      padding: 0 8px;
      font-size: 12px;
      line-height: 38px;
    }

    .hint {
      order: 0;
      margin: -3px 0 13px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      height: 32px;
      margin-top: 4px;
      padding: 6px 12px;
      border: 0;
      border-radius: 10px;
      background: #f1d6a8;
      color: #352517;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
    }

    .button:hover {
      background: #ffe4b7;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .button-secondary {
      border: 1px solid #666;
      background: transparent;
      color: #ddd;
    }

    .button-secondary:hover {
      background: #333;
    }

    .save-row {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .save-output {
      grid-template-columns: minmax(0, 1fr) 112px;
      align-items: end;
    }

    .save-tools {
      grid-template-columns: 32px 32px 32px 32px minmax(0, 1fr);
      align-items: center;
    }

    .save-row .button {
      height: 32px;
      margin-top: 0;
      padding: 6px;
      font-size: 13px;
    }

    .save-tools .icon-button,
    .slot-tools .icon-button {
      line-height: 1;
    }

    .save-tools .icon-button svg,
    .slot-tools .icon-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .slot-tools {
      grid-template-columns: minmax(0, 1fr) 32px 32px;
      align-items: center;
    }

    .save-row select {
      width: 100%;
      height: 32px;
      padding: 6px 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #111;
      color: #fff;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      max-width: min(320px, calc(100vw - 40px));
      padding: 10px 14px;
      border: 1px solid rgba(241, 214, 168, 0.4);
      border-radius: 999px;
      background: rgba(22, 22, 22, 0.92);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      color: #f1d6a8;
      font-size: 13px;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.is-error {
      border-color: rgba(255, 154, 154, 0.45);
      color: #ff9a9a;
    }

    .preview {
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .canvas {
      position: relative;
      width: min(80vw, 900px);
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #333;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .canvas.is-dragging {
      cursor: grabbing;
    }

    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      left: 50%;
      top: 50%;

      max-width: none;
      max-height: none;

      width: 100%;
      height: 100%;
      object-fit: cover;

      transform: translate(-50%, -50%) translate(var(--image-x), var(--image-y)) scale(var(--image-scale));
      transform-origin: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .outside-mask {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .clock {
      position: absolute;
      left: 50%;
      top: 54%;
      width: var(--clock-size);
      height: var(--clock-size);
      transform: translate(-50%, -50%);
      z-index: 3;
      pointer-events: none;
    }

    .face {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--ring-size);
      height: var(--ring-size);
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    .tick {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 50% 100%;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3.5%;
      height: 3.5%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .label-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }

    .label-svg text {
      paint-order: stroke;
      stroke-linejoin: round;
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="panel">
      <h1>시계 설정</h1>
      <p class="hint">배경 그림을 넣고 시계 모양과 시간을 조절한 뒤 PNG로 저장하세요.</p>

      <section class="section section-save">
        <h2>저장</h2>

        <div class="save-row save-output">
          <label>
            <span class="sr-only">이미지 크기</span>
            <select id="exportSize">
              <option value="1024">1024 x 1024</option>
              <option value="1536" selected>1536 x 1536</option>
              <option value="2048">2048 x 2048</option>
            </select>
          </label>
          <button id="download" class="button" type="button">PNG 저장</button>
        </div>

        <div class="save-row slot-tools">
          <select id="slotSelect" title="브라우저 저장 슬롯">
            <option value="1">슬롯 1</option>
            <option value="2">슬롯 2</option>
            <option value="3">슬롯 3</option>
            <option value="4">슬롯 4</option>
            <option value="5">슬롯 5</option>
            <option value="6">슬롯 6</option>
          </select>
          <button id="saveSlot" class="button button-secondary icon-button" type="button" title="선택 슬롯에 저장"
            aria-label="선택 슬롯에 저장">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h12l2 2v14H5z" />
              <path d="M8 4v6h8V4M8 20v-6h8v6" />
            </svg>
          </button>
          <button id="clearSlot" class="button button-secondary icon-button" type="button" title="선택 슬롯 초기화"
            aria-label="선택 슬롯 초기화">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3" />
            </svg>
          </button>
        </div>
        <div class="save-row save-tools">
          <button id="undo" class="button button-secondary icon-button" type="button" title="실행취소" aria-label="실행취소"
            disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 7 4 12l5 5" />
              <path d="M5 12h9a6 6 0 0 1 6 6" />
            </svg>
          </button>
          <button id="redo" class="button button-secondary icon-button" type="button" title="다시실행" aria-label="다시실행"
            disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 7 5 5-5 5" />
              <path d="M19 12h-9a6 6 0 0 0-6 6" />
            </svg>
          </button>
          <button id="exportSettings" class="button button-secondary icon-button" type="button" title="설정 JSON 다운로드"
            aria-label="설정 JSON 다운로드">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3h7l5 5v13H7z" />
              <path d="M14 3v5h5M12 11v7M9 15l3 3 3-3" />
            </svg>
          </button>
          <button id="importSettings" class="button button-secondary icon-button" type="button" title="설정 JSON 업로드"
            aria-label="설정 JSON 업로드">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3h7l5 5v13H7z" />
              <path d="M14 3v5h5M12 18v-7M9 14l3-3 3 3" />
            </svg>
          </button>
          <button id="newProject" class="button button-secondary" type="button">새로 만들기</button>
        </div>
        <input id="importSettingsFile" type="file" accept="application/json,.json" hidden />
      </section>

      <details id="imageSection" class="section section-image" open>
        <summary>이미지</summary>

        <div class="field">
          <label>이미지 파일</label>
          <input id="file" type="file" accept="image/*" />
        </div>

        <div class="compact-group">
          <div class="field">
            <label>이미지 확대</label>
            <div class="range-row">
              <input id="imageScale" type="range" min="30" max="500" value="100" />
              <output id="imageScaleValue" class="range-value">100%</output>
            </div>
          </div>

          <div class="field">
            <label>이미지 X 위치</label>
            <div class="range-row">
              <input id="imageX" type="range" min="-100" max="100" value="0" />
              <output id="imageXValue" class="range-value">0px</output>
            </div>
          </div>

          <div class="field">
            <label>이미지 Y 위치</label>
            <div class="range-row">
              <input id="imageY" type="range" min="-100" max="100" value="0" />
              <output id="imageYValue" class="range-value">0px</output>
            </div>
          </div>
        </div>
      </details>

      <details id="clockSection" class="section section-clock" open>
        <summary>시계</summary>

        <div class="time-picker label-toolbar">
          <label>
            <span>시</span>
            <select id="pickerHour"></select>
          </label>
          <label>
            <span>분</span>
            <select id="pickerMinute"></select>
          </label>
          <label>
            <span>시간표시</span>
            <button id="includeTime" class="format-toggle" type="button" aria-pressed="false"><i>T</i></button>
          </label>
        </div>

        <div class="field-row">
          <div class="field">
            <label>테마</label>
            <select id="theme">
              <option value="classic">Classic Ring</option>
              <option value="double">Double Ring</option>
              <option value="minimal">Minimal</option>
              <option value="dot">Dot Marker</option>
            </select>
          </div>

          <div class="field">
            <label>색상</label>
            <input id="clockColor" type="color" value="#fff8ec" />
          </div>
        </div>

        <div class="field-row background-row">
          <div class="field">
            <label>배경 투명도</label>
            <input id="outsideOpacity" type="range" min="0" max="1" step="0.01" value="0.30" />
          </div>

          <div class="field">
            <label>배경색</label>
            <input id="outsideColor" type="color" value="#000000" />
          </div>
        </div>

      </details>

      <details id="textSection" class="section section-text" open>
        <summary>텍스트</summary>

        <div class="field">
          <label>텍스트</label>
          <input id="labelText" type="text" value="설홍시" />
        </div>

        <div class="field">
          <label>폰트</label>
          <select id="fontPreset">
            <option value="pretendard">Pretendard</option>
            <option value="notoSans">Noto Sans KR</option>
            <option value="notoSerif">Noto Serif KR</option>
            <option value="blackHanSans">Black Han Sans</option>
            <option value="nanumGothic">Nanum Gothic</option>
            <option value="nanumPenScript">Nanum Pen Script</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div id="customFontField" class="field" hidden>
          <label>Custom 폰트</label>
          <input id="labelFont" type="text" value="Pretendard, 'Noto Sans KR', sans-serif" />
        </div>

        <div class="label-toolbar">
          <label>
            <span>크기</span>
            <select id="labelFontSize">
              <option value="60">60%</option>
              <option value="80">80%</option>
              <option value="100" selected>100%</option>
              <option value="120">120%</option>
              <option value="140">140%</option>
              <option value="160">160%</option>
            </select>
          </label>
          <label>
            <span>Bold</span>
            <button id="labelBold" class="format-toggle is-active" type="button" aria-pressed="true">B</button>
          </label>
          <label>
            <span>Italic</span>
            <button id="labelItalic" class="format-toggle" type="button" aria-pressed="false"><i>I</i></button>
          </label>
          <label>
            <span>내부색</span>
            <input id="labelFillColor" type="color" value="#ffffff" />
          </label>
          <label>
            <span>없음</span>
            <button id="labelFillNone" class="format-toggle" type="button" aria-pressed="false">F̸</button>
          </label>
          <label>
            <span>테두리</span>
            <input id="labelStrokeColor" type="color" value="#000000" />
          </label>
          <label>
            <span>없음</span>
            <button id="labelStrokeNone" class="format-toggle" type="button" aria-pressed="false">S̸</button>
          </label>
        </div>

        <div class="compact-group">
          <div class="field">
            <label>텍스트 높이</label>
            <div class="range-row">
              <input id="labelGap" type="range" min="-3" max="3" step="0.5" value="0" />
              <output id="labelGapValue" class="range-value">0</output>
            </div>
          </div>
          <div class="field">
            <label>텍스트 좌우</label>
            <div class="range-row">
              <input id="labelOffset" type="range" min="-15" max="15" step="1" value="0" />
              <output id="labelOffsetValue" class="range-value">0</output>
            </div>
          </div>
        </div>

      </details>

    </aside>

    <main class="preview">
      <div id="canvas" class="canvas">
        <div id="bg" class="bg">
          <img id="bgImg" class="bg-img" alt="" draggable="false">
        </div>
        <div id="outsideMask" class="outside-mask"></div>
        <div id="clock" class="clock"></div>
      </div>
    </main>

  </div>

  <div id="statusMessage" class="toast" role="status" aria-live="polite"></div>

  <script>
    const RING_SIZE = 88;
    const DEFAULT_CLOCK_SIZE = 96;
    const CLOCK_CENTER_Y = 54;
    const TICK_RADIUS_PERCENT = 43;
    const BAR_TICK_WIDTH_PERCENT = 1.5;
    const BAR_TICK_HEIGHT_PERCENT = 7;
    const DOT_TICK_SIZE_PERCENT = 2.8;
    const HOUR_HAND_LENGTH_PERCENT = 27;
    const MINUTE_HAND_LENGTH_PERCENT = 36;
    const CENTER_DOT_SIZE_PERCENT = 3.5;
    const LABEL_FONT_SIZE_PERCENT = 6.2;
    const LABEL_RADIUS_BASE_PERCENT = 45;
    const LABEL_START_OFFSET_BASE_PERCENT = 50;
    const LABEL_OFFSET_TO_ANGLE_RATIO = Math.PI / 100;
    const LABEL_STROKE_WITH_FILL_PERCENT = 1.25;
    const LABEL_STROKE_ONLY_PERCENT = 0.62;
    const HISTORY_LIMIT = 30;
    const DB_NAME = "clock-image-maker";
    const DB_STORE = "settings";
    const DB_KEY = "current";
    function createDefaultState() {
      const now = new Date();

      return {
        imageUrl: "",
        imageX: 0,
        imageY: 0,
        imageScale: 100,
        imageSectionOpen: true,

        labelText: "",
        labelFont: "Pretendard, 'Noto Sans KR', sans-serif",
        fontPreset: "pretendard",
        labelBold: true,
        labelItalic: false,
        labelFontSize: 100,
        labelFillColor: "#ffffff",
        labelFillNone: false,
        labelStrokeColor: "#000000",
        labelStrokeNone: false,
        labelGap: 0,
        labelOffset: 0,

        hour: (now.getHours() % 12) || 12,
        minute: now.getMinutes(),
        includeTime: true,

        theme: "classic",
        clockColor: "#fff8ec",

        outsideColor: "#000000",
        outsideOpacity: 0.30,
        clockSectionOpen: true,
        textSectionOpen: true
      };
    }

    const state = createDefaultState();
    const undoStack = [];
    const redoStack = [];
    let pendingHistorySnapshot = null;
    let pendingHistoryCommitted = false;
    const historyImages = new Map();
    let historyImageId = 0;
    let statusTimer = null;
    let cacheStatusTimer = null;
    let settingsSaveVersion = 0;
    let activeSlotBaselineSnapshot = null;

    const themes = {
      classic: {
        color: "#fff8ec",
        ring: {
          widthPx: 10,
          widthPercent: 0.009,
          style: "solid"
        },
        ticks: {
          type: "bar"
        },
        hands: {
          type: "round"
        },
        centerDot: false
      },
      double: {
        color: "#fff8ec",
        ring: {
          widthPx: 8,
          widthPercent: 0.009,
          style: "double",
          innerWidthPercent: 0.003,
          innerInsetPercent: 0.009
        },
        ticks: {
          type: "bar"
        },
        hands: {
          type: "diamond"
        },
        centerDot: false
      },
      minimal: {

          widthPercent: 0.004,

        },
        ticks: {

        },

    const $ = id => document.getElementById(id);

    const els = {
      file: $("file"),
      imageX: $("imageX"),
      imageY: $("imageY"),
      imageScale: $("imageScale"),
      imageXValue: $("imageXValue"),
      imageYValue: $("imageYValue"),
      imageScaleValue: $("imageScaleValue"),
      labelText: $("labelText"),
      labelFont: $("labelFont"),
      fontPreset: $("fontPreset"),
      customFontField: $("customFontField"),
      labelBold: $("labelBold"),
      labelItalic: $("labelItalic"),
      labelFontSize: $("labelFontSize"),
      labelFillColor: $("labelFillColor"),
      labelFillNone: $("labelFillNone"),
      labelStrokeColor: $("labelStrokeColor"),
      labelStrokeNone: $("labelStrokeNone"),
      labelGap: $("labelGap"),
      labelGapValue: $("labelGapValue"),
      labelOffset: $("labelOffset"),
      labelOffsetValue: $("labelOffsetValue"),
      pickerHour: $("pickerHour"),
      pickerMinute: $("pickerMinute"),
      includeTime: $("includeTime"),
      theme: $("theme"),
      clockColor: $("clockColor"),
      outsideColor: $("outsideColor"),
      outsideOpacity: $("outsideOpacity"),
      exportSize: $("exportSize"),
      download: $("download"),
      undo: $("undo"),
      redo: $("redo"),
      statusMessage: $("statusMessage"),
      exportSettings: $("exportSettings"),
      importSettings: $("importSettings"),
      importSettingsFile: $("importSettingsFile"),
      slotSelect: $("slotSelect"),
      saveSlot: $("saveSlot"),
      clearSlot: $("clearSlot"),
      newProject: $("newProject"),
      imageSection: $("imageSection"),
      clockSection: $("clockSection"),
      textSection: $("textSection"),

      canvas: $("canvas"),
      bg: $("bg"),
      bgImg: $("bgImg"),
      outsideMask: $("outsideMask"),
      clock: $("clock")
    };

    let activeSlotValue = els.slotSelect.value;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, Number(value)));
    }

    function openSettingsDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.addEventListener("upgradeneeded", () => {
          request.result.createObjectStore(DB_STORE);
        });

        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
    }

    async function loadSettings() {
      try {
        const db = await openSettingsDb();
        const cached = await new Promise((resolve, reject) => {
          const request = db.transaction(DB_STORE).objectStore(DB_STORE).get(DB_KEY);
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();

        if (cached) {
          Object.assign(state, cached);
          if (!Object.prototype.hasOwnProperty.call(cached, "fontPreset")) {
            state.fontPreset = "custom";
          }
          if (cached.labelStrokeColor === "#5a321f") {
            state.labelStrokeColor = "#000000";
          }
        }
        state.labelGap = clamp(state.labelGap, -3, 3);
      } catch (error) {
        console.warn("설정 캐시를 불러오지 못했습니다.", error);
      }
    }

    async function saveSettings(options = {}) {
      const { notify = false } = options;
      const saveVersion = ++settingsSaveVersion;

      try {
        const db = await openSettingsDb();
        await new Promise((resolve, reject) => {
          const request = db
            .transaction(DB_STORE, "readwrite")
            .objectStore(DB_STORE)
            .put({ ...state }, DB_KEY);

          request.addEventListener("success", () => resolve());
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();
        if (notify && saveVersion === settingsSaveVersion) {
          queueCacheSavedStatus();
        }
      } catch (error) {
        console.warn("설정 캐시를 저장하지 못했습니다.", error);
        if (saveVersion === settingsSaveVersion) {
          showStatus("캐시 저장 실패", "error", 3500);
        }
      }
    }

    function getHistoryImageRef(imageUrl) {
      if (!imageUrl) return "";

      for (const [ref, cachedImageUrl] of historyImages.entries()) {
        if (cachedImageUrl === imageUrl) return ref;
      }

      const ref = `image-${++historyImageId}`;
      historyImages.set(ref, imageUrl);
      return ref;
    }

    function cloneSettingsSnapshot() {
      const snapshot = JSON.parse(JSON.stringify(state));
      snapshot.imageRef = getHistoryImageRef(snapshot.imageUrl);
      delete snapshot.imageUrl;
      return snapshot;
    }

    function expandSettingsSnapshot(snapshot) {
      if (!snapshot || Object.prototype.hasOwnProperty.call(snapshot, "imageUrl")) {
        return JSON.parse(JSON.stringify(snapshot || {}));
      }

      const expanded = JSON.parse(JSON.stringify(snapshot));
      expanded.imageUrl = expanded.imageRef
        ? historyImages.get(expanded.imageRef) || ""
        : "";
      delete expanded.imageRef;
      return expanded;
    }

    function snapshotsEqual(a, b) {
      const snapshotA = Object.prototype.hasOwnProperty.call(a || {}, "imageUrl")
        ? cloneComparableSnapshot(a)
        : a;
      const snapshotB = Object.prototype.hasOwnProperty.call(b || {}, "imageUrl")
        ? cloneComparableSnapshot(b)
        : b;
      return JSON.stringify(snapshotA) === JSON.stringify(snapshotB);
    }

    function cloneComparableSnapshot(value) {
      const snapshot = JSON.parse(JSON.stringify(value || {}));
      snapshot.imageRef = getHistoryImageRef(snapshot.imageUrl);
      delete snapshot.imageUrl;
      return snapshot;
    }

    function updateHistoryButtons() {
      els.undo.disabled = undoStack.length === 0;
      els.redo.disabled = redoStack.length === 0;
    }

    function showStatus(message, type = "info", duration = 2000) {
      window.clearTimeout(statusTimer);
      window.clearTimeout(cacheStatusTimer);
      els.statusMessage.textContent = message;
      els.statusMessage.classList.toggle("is-error", type === "error");
      els.statusMessage.classList.add("is-visible");

      statusTimer = window.setTimeout(() => {
        els.statusMessage.classList.remove("is-visible", "is-error");
      }, duration);
    }

    function queueCacheSavedStatus() {
      window.clearTimeout(cacheStatusTimer);
      cacheStatusTimer = window.setTimeout(() => {
        showStatus("캐시에 저장됨", "info", 1400);
      }, 450);
    }

    function cleanupHistoryImages() {
      const usedRefs = new Set();

      [...undoStack, ...redoStack, pendingHistorySnapshot]
        .filter(Boolean)
        .forEach(snapshot => {
          if (snapshot.imageRef) {
            usedRefs.add(snapshot.imageRef);
          }
        });

      const currentRef = getHistoryImageRef(state.imageUrl);
      if (currentRef) {
        usedRefs.add(currentRef);
      }

      Array.from(historyImages.keys()).forEach(ref => {
        if (!usedRefs.has(ref)) {
          historyImages.delete(ref);
        }
      });
    }

    function pushUndoSnapshot(snapshot = cloneSettingsSnapshot()) {
      const last = undoStack[undoStack.length - 1];
      if (!last || !snapshotsEqual(last, snapshot)) {
        undoStack.push(snapshot);
      }

      if (undoStack.length > HISTORY_LIMIT) {
        undoStack.shift();
      }

      redoStack.length = 0;
      cleanupHistoryImages();
      updateHistoryButtons();
    }

    function beginHistoryChange() {
      if (!pendingHistorySnapshot) {
        pendingHistorySnapshot = cloneSettingsSnapshot();
        pendingHistoryCommitted = false;
      }
    }

    function recordPendingHistoryChange() {
      if (
        pendingHistorySnapshot &&
        !pendingHistoryCommitted &&
        !snapshotsEqual(pendingHistorySnapshot, state)
      ) {
        pushUndoSnapshot(pendingHistorySnapshot);
        pendingHistoryCommitted = true;
      }
    }

    function commitHistoryChange() {
      if (!pendingHistorySnapshot) return;

      const snapshot = pendingHistorySnapshot;
      pendingHistorySnapshot = null;
      if (!pendingHistoryCommitted && !snapshotsEqual(snapshot, state)) {
        pushUndoSnapshot(snapshot);
      }
      pendingHistoryCommitted = false;
    }

    async function applySettingsSnapshot(snapshot) {
      Object.assign(state, createDefaultState(), expandSettingsSnapshot(snapshot));
      state.labelGap = clamp(state.labelGap, -3, 3);
      els.file.value = "";
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
      await saveSettings();
      updateHistoryButtons();
    }

    async function undoSettings() {
      commitHistoryChange();
      if (undoStack.length === 0) return;

      redoStack.push(cloneSettingsSnapshot());
      const previous = undoStack.pop();
      await applySettingsSnapshot(previous);
      cleanupHistoryImages();
    }

    async function redoSettings() {
      commitHistoryChange();
      if (redoStack.length === 0) return;

      undoStack.push(cloneSettingsSnapshot());
      const next = redoStack.pop();
      await applySettingsSnapshot(next);
      cleanupHistoryImages();
    }

    async function clearSettings() {
      try {
        const db = await openSettingsDb();
        await new Promise((resolve, reject) => {
          const request = db
            .transaction(DB_STORE, "readwrite")
            .objectStore(DB_STORE)
            .delete(DB_KEY);

          request.addEventListener("success", () => resolve());
          request.addEventListener("error", () => reject(request.error));
        });
        db.close();
      } catch (error) {
        console.warn("설정 캐시를 지우지 못했습니다.", error);
      }
    }

    function getSelectedSlotKey() {
      return `slot-${els.slotSelect.value}`;
    }

    async function readSettingsKey(key) {
      const db = await openSettingsDb();
      const value = await new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE).objectStore(DB_STORE).get(key);
        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
      db.close();
      return value;
    }

    async function writeSettingsKey(key, value) {
      const db = await openSettingsDb();
      await new Promise((resolve, reject) => {
        const request = db
          .transaction(DB_STORE, "readwrite")
          .objectStore(DB_STORE)
          .put(value, key);

        request.addEventListener("success", () => resolve());
        request.addEventListener("error", () => reject(request.error));
      });
      db.close();
    }

    async function deleteSettingsKey(key) {
      const db = await openSettingsDb();
      await new Promise((resolve, reject) => {
        const request = db
          .transaction(DB_STORE, "readwrite")
          .objectStore(DB_STORE)
          .delete(key);

        request.addEventListener("success", () => resolve());
        request.addEventListener("error", () => reject(request.error));
      });
      db.close();
    }

    function normalizeSlotSnapshot(snapshot) {
      const normalized = {
        ...createDefaultState(),
        ...(snapshot || {})
      };
      delete normalized.savedAt;
      normalized.labelGap = clamp(normalized.labelGap, -3, 3);
      return normalized;
    }

    function getCurrentSlotSnapshot() {
      return normalizeSlotSnapshot(state);
    }

    function setActiveSlotBaseline(snapshot = state) {
      activeSlotBaselineSnapshot = normalizeSlotSnapshot(snapshot);
    }

    async function hasUnsavedChangesForSlot(slotValue) {
      if (String(slotValue) === String(activeSlotValue) && activeSlotBaselineSnapshot) {
        return !snapshotsEqual(activeSlotBaselineSnapshot, getCurrentSlotSnapshot());
      }

      const cached = await readSettingsKey(`slot-${slotValue}`);
      return !snapshotsEqual(
        normalizeSlotSnapshot(cached),
        getCurrentSlotSnapshot()
      );
    }

    function getSlotLabel(slotValue) {
      const option = Array.from(els.slotSelect.options)
        .find(item => item.value === String(slotValue));
      return option?.textContent || `슬롯 ${slotValue}`;
    }

    async function changeSelectedSlot(nextValue) {
      const previousValue = activeSlotValue;
      if (String(nextValue) === String(previousValue)) return;

      try {
        const hasUnsaved = await hasUnsavedChangesForSlot(previousValue);
        if (hasUnsaved) {
          const shouldChange = window.confirm(
            `${getSlotLabel(previousValue)}에 현재 작업이 저장되어 있지 않습니다. ${getSlotLabel(nextValue)}로 변경할까요?`
          );

          if (!shouldChange) {
            els.slotSelect.value = previousValue;
            return;
          }
        }

        els.slotSelect.value = nextValue;
        activeSlotValue = String(nextValue);
        const nextSlot = await readSettingsKey(`slot-${nextValue}`);
        if (!nextSlot) {
          applySlotSnapshot(createDefaultState());
          els.file.value = "";
          setActiveSlotBaseline();
          await saveSettings();
          showStatus(`${els.slotSelect.options[els.slotSelect.selectedIndex].textContent}은 비어 있어 새 작업을 시작했습니다.`);
          return;
        }

        applySlotSnapshot(nextSlot);
        setActiveSlotBaseline(nextSlot);
        await saveSettings();
        showStatus(`${els.slotSelect.options[els.slotSelect.selectedIndex].textContent}을 불러왔습니다.`);
      } catch (error) {
        console.warn("슬롯 변경 확인에 실패했습니다.", error);
        els.slotSelect.value = previousValue;
        activeSlotValue = previousValue;
        showStatus("슬롯 상태를 확인하지 못했습니다.", "error");
      }
    }

    function applySlotSnapshot(snapshot) {
      pushUndoSnapshot();
      Object.assign(state, createDefaultState(), snapshot);
      state.labelGap = clamp(state.labelGap, -3, 3);
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
    }

    async function saveSelectedSlot() {
      const slotLabel = els.slotSelect.options[els.slotSelect.selectedIndex].textContent;
      const shouldSave = window.confirm(`${slotLabel}에 현재 작업을 저장할까요? 기존 슬롯 내용은 덮어씁니다.`);
      if (!shouldSave) return;

      try {
        await writeSettingsKey(getSelectedSlotKey(), {
          ...state,
          savedAt: new Date().toISOString()
        });
        setActiveSlotBaseline();
        showStatus(`${slotLabel}에 저장했습니다.`);
      } catch (error) {
        console.warn("슬롯 저장에 실패했습니다.", error);
        showStatus("슬롯에 저장하지 못했습니다.", "error");
      }
    }

    async function clearSelectedSlot() {
      const slotLabel = els.slotSelect.options[els.slotSelect.selectedIndex].textContent;

      try {
        const cached = await readSettingsKey(getSelectedSlotKey());
        if (!cached) {
          showStatus(`${slotLabel}은 이미 비어 있습니다.`);
          return;
        }

        const shouldClear = window.confirm(`${slotLabel}에 저장된 작업을 삭제할까요?`);
        if (!shouldClear) return;

        await deleteSettingsKey(getSelectedSlotKey());
        showStatus(`${slotLabel}을 비웠습니다.`);
      } catch (error) {
        console.warn("슬롯 초기화에 실패했습니다.", error);
        showStatus("슬롯을 초기화하지 못했습니다.", "error");
      }
    }

    async function createNewProject() {
      const shouldReset = window.confirm(
        "새로 만들기를 실행하면 저장된 이미지와 설정 캐시가 삭제됩니다. 계속할까요?"
      );
      if (!shouldReset) return;

      pushUndoSnapshot();
      await clearSettings();
      Object.assign(state, createDefaultState());
      els.file.value = "";
      syncControlsFromState();
      populateTimePicker();
      updateImageControlRange();
      render();
      setActiveSlotBaseline();
      await saveSettings();
      showStatus("새 작업을 시작했습니다.");
    }

    function exportSettingsJson() {
      const payload = {
        app: "clock-image-maker",
        version: 1,
        exportedAt: new Date().toISOString(),
        settings: { ...state }
      };

      const url = URL.createObjectURL(
        new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" })
      );
      const link = document.createElement("a");
      link.download = `clock-image-maker-${formatTime().replace(":", "-")}.json`;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
      showStatus("설정 JSON을 다운로드했습니다.");
    }

    function importSettingsJson(file) {
      const reader = new FileReader();

      reader.addEventListener("load", async () => {
        try {
          const payload = JSON.parse(reader.result);

          if (
            payload?.app !== "clock-image-maker" ||
            payload?.version !== 1 ||
            !payload.settings ||
            typeof payload.settings !== "object"
          ) {
            throw new Error("지원하지 않는 설정 파일입니다.");
          }

          pushUndoSnapshot();
          Object.assign(state, createDefaultState(), payload.settings);
          syncControlsFromState();
          populateTimePicker();
          updateImageControlRange();
          render();
          setActiveSlotBaseline();
          await saveSettings();
          showStatus("설정 JSON을 불러왔습니다.");
        } catch (error) {
          showStatus(error.message || "설정 JSON을 불러오지 못했습니다.", "error");
        } finally {
          els.importSettingsFile.value = "";
        }
      });

      reader.addEventListener("error", () => {
        showStatus("설정 JSON 파일을 읽지 못했습니다.", "error");
        els.importSettingsFile.value = "";
      });

      reader.readAsText(file, "utf-8");
    }

    function syncControlsFromState() {
      [
        "imageX",
        "imageY",
        "imageScale",
        "labelText",
        "labelFont",
        "fontPreset",
        "labelFontSize",
        "labelFillColor",
        "labelStrokeColor",
        "labelGap",
        "labelOffset",
        "theme",
        "clockColor",
        "outsideColor",
        "outsideOpacity"
      ].forEach(key => {
        els[key].value = state[key];
      });

      updateFormatToggle(els.includeTime, includeTime);
      updateFormatToggle(els.labelBold, state.labelBold);
      updateFormatToggle(els.labelItalic, state.labelItalic);
      updateFormatToggle(els.labelFillNone, state.labelFillNone);
      updateFormatToggle(els.labelStrokeNone, state.labelStrokeNone);
      updateCustomFontVisibility();
      syncSectionOpenStates();
    }

    function syncSectionOpenStates() {
      els.imageSection.open = Boolean(state.imageSectionOpen);
      els.clockSection.open = Boolean(state.clockSectionOpen);
      els.textSection.open = Boolean(state.textSectionOpen);
    }

    function bindSectionOpenState(section, key) {
      section.addEventListener("toggle", () => {
        state[key] = section.open;
        saveSettings();
      });
    }

    function getLabelFontFamily() {
      const presets = {
        pretendard: "Pretendard, 'Noto Sans KR', sans-serif",
        notoSans: "'Noto Sans KR', sans-serif",
        notoSerif: "'Noto Serif KR', serif",
        blackHanSans: "'Black Han Sans', sans-serif",
        nanumGothic: "'Nanum Gothic', sans-serif",
        nanumPenScript: "'Nanum Pen Script', cursive",
        serif: "Georgia, 'Times New Roman', serif",
        monospace: "Consolas, monospace"
      };

      return state.fontPreset === "custom"
        ? state.labelFont
        : presets[state.fontPreset] || presets.pretendard;
    }

    function getLabelFontWeight() {
      return state.labelBold ? 900 : 400;
    }

    function getLabelGeometry(clockDiameter = 100) {
      const radiusPercent = LABEL_RADIUS_BASE_PERCENT + Number(state.labelGap);
      const fontSizePercent = LABEL_FONT_SIZE_PERCENT * (state.labelFontSize / 100);
      const strokeWidthPercent = state.labelFillNone
        ? LABEL_STROKE_ONLY_PERCENT
        : LABEL_STROKE_WITH_FILL_PERCENT;

      return {
        radiusPercent,
        radius: clockDiameter * (radiusPercent / 100),
        startOffsetPercent: LABEL_START_OFFSET_BASE_PERCENT + Number(state.labelOffset),
        centerAngle: -Math.PI / 2 + (Number(state.labelOffset) * LABEL_OFFSET_TO_ANGLE_RATIO),
        fontSizePercent,
        fontSize: clockDiameter * (fontSizePercent / 100),
        strokeWidthPercent,
        strokeWidth: clockDiameter * (strokeWidthPercent / 100)
      };
    }

    function getLabelFontCss(fontSize) {
      return `${state.labelItalic ? "italic " : ""}${getLabelFontWeight()} ${fontSize}px ${getLabelFontFamily()}`;
    }

    function updateCustomFontVisibility() {
      els.customFontField.hidden = state.fontPreset !== "custom";
    }

    function updateFormatToggle(button, isActive) {
      button.classList.toggle("is-active", isActive);
      button.setAttribute("aria-pressed", String(isActive));
    }

    function getClockColor() {
      return state.clockColor || themes[state.theme].color;
    }

    function getRingBorder(theme) {
      return `${theme.ring.widthPx}px ${theme.ring.style} ${getClockColor()}`;
    }

    function getTickType(theme) {
      return theme.ticks?.type || "bar";
    }

    function getHandType(theme) {
      return theme.hands?.type || "round";
    }

    function getHandWidthPercent(theme, name) {
      const handType = getHandType(theme);

      if (handType === "round") return name === "hour" ? 2.5 : 1.5;
      if (handType === "diamond") return name === "hour" ? 3.2 : 2.1;
      if (handType === "thin") return name === "hour" ? 1.1 : 0.75;
      if (handType === "taper") return name === "hour" ? 2.8 : 1.8;
      return name === "hour" ? 2.5 : 1.5;
    }

    function render() {
      const theme = themes[state.theme];

      const ringSize = RING_SIZE;
      els.clock.innerHTML = "";
      updateRangeValues();

      els.clock.style.setProperty("--clock-size", `${DEFAULT_CLOCK_SIZE}%`);
      els.clock.style.setProperty("--ring-size", `${ringSize}%`);
      els.bg.style.backgroundImage = state.imageUrl
        ? "none"
        : "linear-gradient(135deg, #642020, #2d2d2d)";

      els.bgImg.src = state.imageUrl;
      els.bgImg.style.display = state.imageUrl ? "block" : "none";
      els.bg.style.setProperty("--image-x", `${state.imageX}px`);
      els.bg.style.setProperty("--image-y", `${state.imageY}px`);
      els.bg.style.setProperty("--image-scale", state.imageScale / 100);

      updateOutsideMask(DEFAULT_CLOCK_SIZE, ringSize);

      const face = document.createElement("div");
      face.className = "face";
      face.style.border = getRingBorder(theme);
      els.clock.appendChild(face);

      createCurvedLabel(els.clock);
      createTicks(face, theme);
      createHands(face, theme);

      if (theme.centerDot) {
        createCenterDot(face, getClockColor());
      }
    }

    function updateRangeValues() {
      els.imageScaleValue.textContent = `${state.imageScale}%`;
      els.imageXValue.textContent = `${state.imageX}px`;
      els.imageYValue.textContent = `${state.imageY}px`;
      els.labelGapValue.textContent = `${state.labelGap}`;
      els.labelOffsetValue.textContent = `${state.labelOffset}`;
    }

    function updateImageControlRange() {
      const canvasSize = document.querySelector(".canvas").getBoundingClientRect().width;
      const renderedSize = canvasSize * (state.imageScale / 100);
      const limit = Math.round(renderedSize / 3);

      els.imageX.min = -limit;
      els.imageX.max = limit;

      els.imageY.min = -limit;
      els.imageY.max = limit;

      state.imageX = Math.max(-limit, Math.min(limit, state.imageX));
      state.imageY = Math.max(-limit, Math.min(limit, state.imageY));

      els.imageX.value = state.imageX;
      els.imageY.value = state.imageY;
    }

    function syncImagePositionControls() {
      els.imageX.value = state.imageX;
      els.imageY.value = state.imageY;
      updateRangeValues();
    }

    function clampImagePosition() {
      state.imageX = clamp(state.imageX, Number(els.imageX.min), Number(els.imageX.max));
      state.imageY = clamp(state.imageY, Number(els.imageY.min), Number(els.imageY.max));
    }

    function bindImageDrag() {
      let drag = null;

      els.canvas.addEventListener("pointerdown", event => {
        if (!state.imageUrl) return;

        beginHistoryChange();
        drag = {
          startX: event.clientX,
          startY: event.clientY,
          imageX: state.imageX,
          imageY: state.imageY
        };

        els.canvas.classList.add("is-dragging");
        els.canvas.setPointerCapture(event.pointerId);
      });

      els.canvas.addEventListener("dragstart", event => {
        event.preventDefault();
      });

      els.canvas.addEventListener("pointermove", event => {
        if (!drag) return;

        state.imageX = Math.round(drag.imageX + event.clientX - drag.startX);
        state.imageY = Math.round(drag.imageY + event.clientY - drag.startY);
        clampImagePosition();
        syncImagePositionControls();
        render();
        recordPendingHistoryChange();
      });

      function endDrag(event) {
        if (!drag) return;

        drag = null;
        els.canvas.classList.remove("is-dragging");
        if (els.canvas.hasPointerCapture(event.pointerId)) {
          els.canvas.releasePointerCapture(event.pointerId);
        }
        commitHistoryChange();
        saveSettings({ notify: true });
      }

      els.canvas.addEventListener("pointerup", endDrag);
      els.canvas.addEventListener("pointercancel", endDrag);
      els.canvas.addEventListener("lostpointercapture", () => {
        if (!drag) return;
        drag = null;
        els.canvas.classList.remove("is-dragging");
        commitHistoryChange();
        saveSettings({ notify: true });
      });
    }

    function updateOutsideMask(clockSize, ringSize) {
      const canvasSize = document.querySelector(".canvas").getBoundingClientRect().width;
      const radius = canvasSize * (clockSize / 100) * (ringSize / 100) / 2;
      const centerX = canvasSize / 2;
      const centerY = canvasSize * (CLOCK_CENTER_Y / 100);

      els.outsideMask.style.background = state.outsideColor;
      els.outsideMask.style.opacity = state.outsideOpacity;

      els.outsideMask.style.mask = `
        radial-gradient(
          circle ${radius}px at ${centerX}px ${centerY}px,
          transparent 0 ${radius}px,
          black ${radius + 1}px
        )
      `;

      els.outsideMask.style.webkitMask = els.outsideMask.style.mask;
    }

    function createCurvedLabel(parent) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const geometry = getLabelGeometry();

      svg.classList.add("label-svg");
      svg.setAttribute("viewBox", "0 0 100 100");

      svg.innerHTML = `
    <defs>
      <path id="labelPath" d="M ${50 - geometry.radius} 50 A ${geometry.radius} ${geometry.radius} 0 0 1 ${50 + geometry.radius} 50" />
    </defs>

    <text
      font-family="${escapeAttr(getLabelFontFamily())}"
      font-weight="${getLabelFontWeight()}"
      font-style="${state.labelItalic ? "italic" : "normal"}"
      font-size="${geometry.fontSize}"
      fill="${escapeAttr(state.labelFillNone ? "transparent" : state.labelFillColor)}"
      stroke="${escapeAttr(state.labelStrokeNone ? "transparent" : state.labelStrokeColor)}"
      stroke-width="${geometry.strokeWidth}">
      <textPath
        href="#labelPath"
        startOffset="${geometry.startOffsetPercent}%"
        text-anchor="middle">
        ${escapeHTML(getLabelText())}
      </textPath>
    </text>
  `;

      parent.appendChild(svg);
    }

    function createTicks(parent, theme) {
      const tickType = getTickType(theme);
      if (tickType === "none") return;

      const radius = TICK_RADIUS_PERCENT;

      for (let i = 0; i < 12; i++) {
        const angle = i * 30;
        const rad = angle * Math.PI / 180;

        const tick = document.createElement("div");
        tick.className = "tick";

        tick.style.left = `${50 + Math.sin(rad) * radius}%`;
        tick.style.top = `${50 - Math.cos(rad) * radius}%`;
        tick.style.background = getClockColor();

        if (tickType === "bar") {
          tick.style.width = `${BAR_TICK_WIDTH_PERCENT}%`;
          tick.style.height = `${BAR_TICK_HEIGHT_PERCENT}%`;
          tick.style.borderRadius = "999px";
          tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        if (tickType === "dot") {
          tick.style.width = `${DOT_TICK_SIZE_PERCENT}%`;
          tick.style.height = `${DOT_TICK_SIZE_PERCENT}%`;
          tick.style.borderRadius = "50%";
          tick.style.transform = "translate(-50%, -50%)";
        }

        parent.appendChild(tick);
      }
    }

    function createHands(parent, theme) {
      const hourAngle = ((state.hour % 12) * 30) + (state.minute * 0.5);
      const minuteAngle = state.minute * 6;

      createHand(parent, "hour", hourAngle, HOUR_HAND_LENGTH_PERCENT, theme);
      createHand(parent, "minute", minuteAngle, MINUTE_HAND_LENGTH_PERCENT, theme);
    }

    function createHand(parent, name, angle, length, theme) {
      const handType = getHandType(theme);
      const hand = document.createElement("div");
      hand.className = `hand ${name}`;
      hand.style.height = `${length}%`;
      hand.style.background = getClockColor();
      hand.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;

      if (handType === "round") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.borderRadius = "999px";
      }

      if (handType === "diamond") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.clipPath = "polygon(50% 0%, 100% 88%, 50% 100%, 0% 88%)";
      }

      if (handType === "thin") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.borderRadius = "999px";
      }

      if (handType === "taper") {
        hand.style.width = `${getHandWidthPercent(theme, name)}%`;
        hand.style.clipPath = "polygon(50% 0%, 82% 100%, 18% 100%)";
      }

      parent.appendChild(hand);
    }

    function createCenterDot(parent, color) {
      const dot = document.createElement("div");
      dot.className = "center-dot";
      dot.style.background = color;
      parent.appendChild(dot);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHTML(value).replace(/`/g, "&#096;");
    }

    function bindControls() {
      els.file.addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.addEventListener("load", () => {
          pushUndoSnapshot();
          state.imageUrl = reader.result;
          render();
          saveSettings();
        });
        reader.readAsDataURL(file);
      });

      populateTimePicker();

      [els.pickerHour, els.pickerMinute].forEach(select => {
        select.addEventListener("input", () => {
          pushUndoSnapshot();
          state.hour = Number(els.pickerHour.value);
          state.minute = Number(els.pickerMinute.value);
          render();
          saveSettings();
        });
      });

      els.fontPreset.addEventListener("input", event => {
        pushUndoSnapshot();
        state.fontPreset = event.target.value;
        updateCustomFontVisibility();
        render();
        saveSettings();
      });

      [
        [els.includeTime, "includeTime"],
        [els.labelBold, "labelBold"],
        [els.labelItalic, "labelItalic"],
        [els.labelFillNone, "labelFillNone"],
        [els.labelStrokeNone, "labelStrokeNone"]
      ].forEach(([button, key]) => {
        button.addEventListener("click", () => {
          pushUndoSnapshot();
          state[key] = !state[key];
          updateFormatToggle(button, state[key]);
          render();
          saveSettings();
        });
      });

      const bindings = [
        ["imageX", "number"],
        ["imageY", "number"],
        ["imageScale", "number"],
        ["labelText", "text"],
        ["labelFont", "text"],
        ["labelFontSize", "number"],
        ["labelFillColor", "text"],
        ["labelStrokeColor", "text"],
        ["labelGap", "number"],
        ["labelOffset", "number"],
        ["theme", "text"],
        ["clockColor", "text"],
        ["outsideColor", "text"],
        ["outsideOpacity", "number"]
      ];

      bindings.forEach(([key, type]) => {
        els[key].addEventListener("focus", beginHistoryChange);
        els[key].addEventListener("pointerdown", beginHistoryChange);
        els[key].addEventListener("change", () => {
          commitHistoryChange();
          saveSettings({ notify: true });
        });
        els[key].addEventListener("input", event => {
          beginHistoryChange();
          state[key] = type === "number"
            ? Number(event.target.value)
            : event.target.value;

          render();
          recordPendingHistoryChange();

          // 확대가 바뀌면 이동범위 재계산
          if (key === "imageScale") {
            updateImageControlRange();
            render();
          }

          saveSettings();
        });
      });

      els.download.addEventListener("click", downloadPng);
      els.undo.addEventListener("click", undoSettings);
      els.redo.addEventListener("click", redoSettings);
      els.exportSettings.addEventListener("click", exportSettingsJson);
      els.importSettings.addEventListener("click", () => els.importSettingsFile.click());
      els.importSettingsFile.addEventListener("change", event => {
        const file = event.target.files[0];
        if (file) importSettingsJson(file);
      });
      els.saveSlot.addEventListener("click", saveSelectedSlot);
      els.clearSlot.addEventListener("click", clearSelectedSlot);
      els.slotSelect.addEventListener("change", event => {
        changeSelectedSlot(event.target.value);
      });
      els.newProject.addEventListener("click", createNewProject);
      bindSectionOpenState(els.imageSection, "imageSectionOpen");
      bindSectionOpenState(els.clockSection, "clockSectionOpen");
      bindSectionOpenState(els.textSection, "textSectionOpen");
      window.addEventListener("keydown", handleKeyboardShortcuts);
      bindImageDrag();
    }

    function handleKeyboardShortcuts(event) {
      if (!event.ctrlKey || event.altKey || event.metaKey) return;

      const key = event.key.toLowerCase();

      if (key === "s") {
        event.preventDefault();
        downloadPng();
        return;
      }

      if (key === "o") {
        event.preventDefault();
        els.file.click();
        return;
      }

      if (key === "n") {
        event.preventDefault();
        createNewProject();
        return;
      }

      if (/^[1-6]$/.test(key)) {
        event.preventDefault();
        changeSelectedSlot(key);
        return;
      }

      if (key === "z" && event.shiftKey) {
        event.preventDefault();
        redoSettings();
        return;
      }

      if (key === "z") {
        event.preventDefault();
        undoSettings();
        return;
      }

      if (key === "y") {
        event.preventDefault();
        redoSettings();
      }
    }

    async function downloadPng() {
      render();
      await waitForExportAssets();

      const size = Number(els.exportSize.value);
      const output = document.createElement("canvas");
      output.width = size;
      output.height = size;

      const context = output.getContext("2d");
      const theme = themes[state.theme];
      const screenSize = $("canvas").getBoundingClientRect().width || size;
      const scale = size / screenSize;
      const centerX = size / 2;
      const centerY = size * (CLOCK_CENTER_Y / 100);
      const clockDiameter = size * (DEFAULT_CLOCK_SIZE / 100);
      const ringRadius = clockDiameter * (RING_SIZE / 100) / 2;

      drawExportBackground(context, size, scale);
      drawExportOutsideMask(context, size, centerX, centerY, ringRadius);
      drawExportRing(context, theme, centerX, centerY, ringRadius, size);
      drawExportTicks(context, theme, centerX, centerY, ringRadius, size);
      drawExportHands(context, theme, centerX, centerY, ringRadius, size);
      drawExportLabel(context, centerX, centerY, clockDiameter);

      const blob = await new Promise(resolve => output.toBlob(resolve, "image/png"));
      if (!blob) {
        showStatus("PNG 이미지를 만들지 못했습니다.", "error");
        return;
      }

      const didSave = await savePngBlob(blob);
      if (didSave) {
        showStatus("PNG 저장을 완료했습니다.");
      }
    }

    async function waitForExportAssets() {
      if (document.fonts?.ready) {
        await document.fonts.ready;
      }

      if (!state.imageUrl || !els.bgImg.src || els.bgImg.complete) return;

      await new Promise(resolve => {
        const done = () => {
          els.bgImg.removeEventListener("load", done);
          els.bgImg.removeEventListener("error", done);
          resolve();
        };

        els.bgImg.addEventListener("load", done, { once: true });
        els.bgImg.addEventListener("error", done, { once: true });
      });
    }

    async function savePngBlob(blob) {
      const filename = getPngFilename();

      if ("showSaveFilePicker" in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: "PNG 이미지",
              accept: { "image/png": [".png"] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (error) {
          if (error.name === "AbortError") return false;
          console.warn("파일 저장 선택기를 사용할 수 없어 다운로드 방식으로 전환합니다.", error);
        }
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = filename;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
      return true;
    }

    function drawExportBackground(context, size, scale) {
      if (!state.imageUrl || !els.bgImg.complete || !els.bgImg.naturalWidth) {
        const gradient = context.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, "#642020");
        gradient.addColorStop(1, "#2d2d2d");
        context.fillStyle = gradient;
        context.fillRect(0, 0, size, size);
        return;
      }

      const image = els.bgImg;
      const coverScale = Math.max(size / image.naturalWidth, size / image.naturalHeight);
      const imageScale = coverScale * (state.imageScale / 100);
      const width = image.naturalWidth * imageScale;
      const height = image.naturalHeight * imageScale;
      const x = ((size - width) / 2) + (state.imageX * scale);
      const y = ((size - height) / 2) + (state.imageY * scale);

      context.drawImage(image, x, y, width, height);
    }

    function drawExportOutsideMask(context, size, centerX, centerY, radius) {
      context.save();
      context.fillStyle = state.outsideColor;
      context.globalAlpha = state.outsideOpacity;
      context.beginPath();
      context.rect(0, 0, size, size);
      context.arc(centerX, centerY, radius, 0, Math.PI * 2);
      context.fill("evenodd");
      context.restore();
    }

    function drawExportRing(context, theme, centerX, centerY, radius, size) {
      const color = getClockColor();
      const ring = theme.ring;

      context.save();
      context.strokeStyle = color;
      context.lineWidth = size * ring.widthPercent;
      context.beginPath();
      context.arc(centerX, centerY, radius, 0, Math.PI * 2);
      context.stroke();

      if (ring.style === "double") {
        context.lineWidth = size * ring.innerWidthPercent;
        context.beginPath();
        context.arc(centerX, centerY, radius - (size * ring.innerInsetPercent), 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();
    }

    function drawExportTicks(context, theme, centerX, centerY, radius, size) {
      const tickType = getTickType(theme);
      if (tickType === "none") return;

      const color = getClockColor();

      context.save();
      context.strokeStyle = color;
      context.fillStyle = color;
      context.lineCap = "round";

      for (let i = 0; i < 12; i++) {
        const angle = (i * 30 - 90) * Math.PI / 180;
        const faceDiameter = radius * 2;
        const tickCenterRadius = faceDiameter * (TICK_RADIUS_PERCENT / 100);

        if (tickType === "dot") {
          context.beginPath();
          context.arc(
            centerX + Math.cos(angle) * tickCenterRadius,
            centerY + Math.sin(angle) * tickCenterRadius,
            faceDiameter * (DOT_TICK_SIZE_PERCENT / 100) / 2,
            0,
            Math.PI * 2
          );
          context.fill();
          continue;
        }

        context.lineWidth = faceDiameter * (BAR_TICK_WIDTH_PERCENT / 100);
        const tickHalfLength = faceDiameter * (BAR_TICK_HEIGHT_PERCENT / 100) / 2;
        context.beginPath();
        context.moveTo(
          centerX + Math.cos(angle) * (tickCenterRadius + tickHalfLength),
          centerY + Math.sin(angle) * (tickCenterRadius + tickHalfLength)
        );
        context.lineTo(
          centerX + Math.cos(angle) * (tickCenterRadius - tickHalfLength),
          centerY + Math.sin(angle) * (tickCenterRadius - tickHalfLength)
        );
        context.stroke();
      }
      context.restore();
    }

    function drawExportHands(context, theme, centerX, centerY, radius, size) {
      const hourAngle = (((state.hour % 12) * 30) + (state.minute * 0.5) - 90) * Math.PI / 180;
      const minuteAngle = ((state.minute * 6) - 90) * Math.PI / 180;

      const faceDiameter = radius * 2;
      drawExportHand(
        context,
        theme,
        centerX,
        centerY,
        faceDiameter * (HOUR_HAND_LENGTH_PERCENT / 100),
        hourAngle,
        faceDiameter * (getHandWidthPercent(theme, "hour") / 100)
      );
      drawExportHand(
        context,
        theme,
        centerX,
        centerY,
        faceDiameter * (MINUTE_HAND_LENGTH_PERCENT / 100),
        minuteAngle,
        faceDiameter * (getHandWidthPercent(theme, "minute") / 100)
      );

      if (theme.centerDot) {
        context.save();
        context.fillStyle = getClockColor();
        context.beginPath();
        context.arc(centerX, centerY, faceDiameter * (CENTER_DOT_SIZE_PERCENT / 100) / 2, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    function drawExportHand(context, theme, centerX, centerY, length, angle, width) {
      const handType = getHandType(theme);

      context.save();
      context.translate(centerX, centerY);
      context.rotate(angle + Math.PI / 2);
      context.fillStyle = getClockColor();
      context.strokeStyle = getClockColor();

      if (handType === "diamond") {
        context.beginPath();
        context.moveTo(0, -length);
        context.lineTo(width / 2, -length * 0.12);
        context.lineTo(0, 0);
        context.lineTo(-width / 2, -length * 0.12);
        context.closePath();
        context.fill();
      } else if (handType === "taper") {
        context.beginPath();
        context.moveTo(0, -length);
        context.lineTo(width * 0.32, 0);
        context.lineTo(-width * 0.32, 0);
        context.closePath();
        context.fill();
      } else {
        context.lineWidth = width;
        context.lineCap = handType === "thin" ? "butt" : "round";
        context.beginPath();
        context.moveTo(0, 0);
        context.lineTo(0, -length);
        context.stroke();
      }

      context.restore();
    }

    function drawExportLabel(context, centerX, centerY, clockDiameter) {
      const text = getLabelText();
      const geometry = getLabelGeometry(clockDiameter);

      context.save();
      context.font = getLabelFontCss(geometry.fontSize);
      context.textAlign = "center";
      context.textBaseline = "alphabetic";
      context.lineJoin = "round";
      context.strokeStyle = state.labelStrokeColor;
      context.lineWidth = geometry.strokeWidth;
      context.fillStyle = state.labelFillColor;

      const correctedWidths = Array.from(text, char => context.measureText(char).width);
      const totalAngle = correctedWidths.reduce((sum, width) => sum + width / geometry.radius, 0);
      let angle = geometry.centerAngle - (totalAngle / 2);

      Array.from(text).forEach((char, index) => {
        const charAngle = correctedWidths[index] / geometry.radius;
        angle += charAngle / 2;
        context.save();
        context.translate(
          centerX + Math.cos(angle) * geometry.radius,
          centerY + Math.sin(angle) * geometry.radius
        );
        context.rotate(angle + Math.PI / 2);
        if (!state.labelStrokeNone) {
          context.strokeText(char, 0, 0);
        }
        if (!state.labelFillNone) {
          context.fillText(char, 0, 0);
        }
        context.restore();
        angle += charAngle / 2;
      });

      context.restore();
    }

    function getLabelText() {
      if (!state.includeTime) return state.labelText;
      return `${formatTime()} ${state.labelText}`;
    }

    function populateTimePicker() {
      els.pickerHour.innerHTML = Array.from(
        { length: 12 },
        (_, index) => {
          const hour = index + 1;
          return `<option value="${hour}">${String(hour).padStart(2, "0")}</option>`;
        }
      ).join("");

      els.pickerMinute.innerHTML = Array.from(
        { length: 60 },
        (_, minute) => `<option value="${minute}">${String(minute).padStart(2, "0")}</option>`
      ).join("");

      els.pickerHour.value = state.hour;
      els.pickerMinute.value = state.minute;
    }

    function formatTime() {
      return `${String(state.hour).padStart(2, "0")}:${String(state.minute).padStart(2, "0")}`;
    }

    function formatTimestamp(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      const second = String(date.getSeconds()).padStart(2, "0");
      return `${year}${month}${day}-${hour}${minute}${second}`;
    }

    function sanitizeFilenamePart(value, fallback = "clock") {
      const sanitized = String(value || "")
        .trim()
        .replace(/[\\/:*?"<>|]/g, "")
        .replace(/\s+/g, "_")
        .replace(/_+/g, "_")
        .slice(0, 60);

      return sanitized || fallback;
    }

    function getPngFilename() {
      const label = sanitizeFilenamePart(state.labelText || getLabelText());
      return `${label}_${formatTimestamp()}.png`;
    }

    async function initialize() {
      await loadSettings();
      setActiveSlotBaseline();
      syncControlsFromState();
      updateImageControlRange();
      bindControls();
      render();
      updateHistoryButtons();
    }

    initialize();
  </script>
</body>

</html>
